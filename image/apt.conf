// apt settings for the image build's fixed Debian snapshot (see Dockerfile).
Acquire::Check-Valid-Until "false";
// The snapshot archive redirects every download, which apt's HTTP pipelining mismatches.
Acquire::http::Pipeline-Depth "0";
// apt retries a download that meets a network error, or an HTTP 408, 429, 500, 502, 503, 504, or
// 599 with a body, five times with growing waits; the build's retry helper retries the rest.
Acquire::Retries "5";
// An index that still fails after its retries fails `apt-get update`, so the retry helper runs it
// again, instead of apt installing from the suites it did fetch.
APT::Update::Error-Mode "any";
