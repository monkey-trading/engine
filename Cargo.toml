[workspace]
resolver = "3"
members = ["crates/core", "crates/node", "crates/verify", "crates/verify-wasm", "crates/wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/0xjevons/monkeytrading"

[workspace.dependencies]
engine-core = { path = "crates/core", version = "0.1.0" }
engine-verify = { path = "crates/verify", version = "0.1.0" }
engine-wire = { path = "crates/wire", version = "0.1.0" }

alloy-dyn-abi = { version = "1.7.3", default-features = false, features = ["std", "eip712"] }
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = ["std"] }
alloy = { version = "2.5", default-features = false, features = ["std", "rpc-client", "rpc-types", "sol-types", "eips"] }
# Enable HTTP/TLS on the components without the aggregate provider feature forwarding.
alloy-rpc-client = { version = "2.5", default-features = false, features = ["reqwest"] }
alloy-transport-http = { version = "2.5", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# Without `simd-unsafe`, its only source of `unsafe` code.
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
csv = "1.4"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
hex = "0.4"
# HPKE (RFC 9180): an upgrade encrypts the enclave's keys to the next release's attested one-time key.
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# ACME (RFC 8555) for the API's public certificate, on ring and the node's own HTTP client, so it
# brings no second crypto backend and never reads the host's trust store.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring"] }
# Address ranges for the PROXY protocol's trusted proxies; already in the tree through reqwest.
ipnet = { version = "2.12", features = ["serde"] }
jmt = { version = "=0.12.0", default-features = false, features = ["std", "sha2"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
nix = { version = "0.31.3", default-features = false, features = ["sched"] }
# ECDSA on P-384: the attestation report's signature and the test chain's certificates. Pure Rust,
# so the native and browser verifiers run the same implementation. Without `std`, which would pull
# in an OS random source that does not build for the browser and that verification never uses.
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
# PROXY protocol v2 header parsing for the proxy that passes TLS through (`[api.proxy_protocol]`).
ppp = "2.3"
prometheus-client = "0.25"
proptest = { version = "1.12", default-features = false, features = ["std"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# HTTPS for alert webhooks. TLS is configured in code: rustls on ring with the compiled-in Mozilla roots.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
# Certificate Transparency log signatures. The workspace already builds ring as rustls's only
# crypto provider, so no new backend enters the tree.
ring = { version = "0.17", default-features = false, features = ["std"] }
# RSASSA-PSS over the vendor's attestation certificates and revocation lists, verification only.
# Pure Rust and without `std`, like p384, for the browser verifier; `sha2` re-exports the digest it
# verifies with.
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "u64_digit"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "limits"] }
# TLS for the API, venue feeds, and alert webhooks with ring as the only crypto provider, so no
# OpenSSL or aws-lc build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SEV-SNP guest's derived key and its own report, which seal the enclave's keys to its launch
# measurement. Only the guest request types and ioctls, without OpenSSL.
sev = { version = "8.0.0", default-features = false, features = ["snp"] }
hmac = "0.13"
sha2 = "0.11"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Venue feeds hand every connection their own rustls config and roots, so this takes only the
# crate's rustls support and none of the root sets it can bundle.
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The browser verifier's JavaScript bindings. Pinned exactly: the wasm-bindgen CLI that generates
# the glue must be this same version.
wasm-bindgen = "=0.2.129"
webpki-root-certs = "1"
webpki-roots = "1"
# X.509 parsing for the attestation certificate chain; already in the tree via rcgen. Signatures are
# checked with p384 and rsa, not this crate's ring-backed `verify`, which does not build for the
# browser.
x509-parser = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panicking task takes the whole node down rather than leaving it running without that task.
panic = "abort"
# Money code: an overflow must halt the engine, never wrap silently.
overflow-checks = true

[profile.dev]
opt-level = 2
lto = "thin"

# The browser verifier's release build (scripts/build-wasm-verifier.sh): the release profile, with
# its overflow checks, optimised for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
