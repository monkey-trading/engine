[package]
name = "engine-node"
description = "TEE-hosted node: sequencer, public event log, API, attestation and custody"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "engine"
path = "src/main.rs"

[features]
# Refuses mock TEE, custody, and feed providers at config load. Release images build with it.
production = []

[dependencies]
engine-core.workspace = true
engine-wire.workspace = true

alloy.workspace = true
alloy-rpc-client.workspace = true
alloy-transport-http.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crc32fast.workspace = true
csv.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
governor.workspace = true
hex.workspace = true
http-body-util.workspace = true
humantime-serde.workspace = true
hyper.workspace = true
hyper-util.workspace = true
instant-acme.workspace = true
jmt.workspace = true
k256 = { workspace = true, features = ["getrandom"] }
prometheus-client.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sha3.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-root-certs.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[dev-dependencies]
chrono.workspace = true
chrono-tz.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "test-util"] }
tower.workspace = true
