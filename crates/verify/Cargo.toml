[package]
name = "engine-verify"
description = "Verifying an enclave's SEV-SNP attestation against release manifests, with no IO and no clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The stand-in vendor chain, forged reports, and release manifest that this crate's tests, the
# node's tests, and the dev scenarios build quotes from.
test-fixtures = ["dep:base64", "dep:rcgen", "p384/pkcs8"]

# No IO, no clock, and no C code: the browser build (engine-verify-wasm) compiles this crate for
# WebAssembly.
[dependencies]
anyhow.workspace = true
hex.workspace = true
p384.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
x509-parser.workspace = true

base64 = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
p384 = { workspace = true, features = ["pkcs8"] }
rand.workspace = true
rcgen.workspace = true

[[example]]
name = "verifier_fixtures"
required-features = ["test-fixtures"]
