[package]
name = "engine-verify-wasm"
description = "The engine's verifier for browsers: attestations, signed responses, and signed stream frames"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` is the WebAssembly module; `rlib` lets the native tests call the same functions.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
engine-verify.workspace = true
engine-wire.workspace = true
hex.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
engine-verify = { workspace = true, features = ["test-fixtures"] }
serde.workspace = true
