[package]
name = "engine-core"
description = "Deterministic trading state machine: pricing, margin, fees, financing and house risk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# This crate must stay deterministic: no clocks, no randomness, no floats, no
# HashMap iteration. Anyone replaying the public event log against this code
# must reproduce the same state roots bit for bit.
[features]
# Five-minute operator turns, for development stacks only (`turns::TURN_MS`). A log written under it
# replays only under it, and a `production` node build refuses it.
short-turns = []
# Test-only hooks on the close-out index (`closeout_index::oracle`): a full check in place of the
# index, and checks of the index against it. This crate's own tests enable it below, which turns it on
# across a workspace build of them, inert until a test sets an oracle; a build without this crate's
# dev-dependencies, as the node's release build is, leaves it off.
closeout-oracle = []

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
k256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true

[dev-dependencies]
engine-core = { workspace = true, features = ["closeout-oracle"] }
alloy-dyn-abi.workspace = true
anyhow.workspace = true
hex.workspace = true
proptest.workspace = true
toml.workspace = true

# The reference session's version parts carry tests of their own.
[[example]]
name = "reference_log"
test = true
