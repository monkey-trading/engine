# Local development config: mock TEE, mock custody, mock feeds. Set
# feeds.provider = "venues" to price the crypto markets from live venues;
# the other markets then have no price.
#
# Everything under [genesis] is protocol. On first boot it is sequenced into
# the public log as admin commands, so the rules every fill ran under are on
# record. It goes in all or nothing: a value the engine would reject fails the
# config load, and a log whose first boot stopped partway through genesis, or
# that ran another genesis, is refused (remove data/dev/log and data/dev/history
# with the node stopped).
#
# Margin rates, the fee, financing markups and benchmark rates are placeholders
# at professional-client leverage levels; set them before launch.
#
# House caps are the larger of a share of house NAV (house_cap_bps,
# house_total_cap_bps) and a dollar floor (house_cap_floor,
# house_total_cap_floor), so trading opens from a zero or negative house. The
# floors here are the caps a house with 1m of NAV would have.

[node]
listen = "127.0.0.1:8080"
log_dir = "data/dev/log"
segment_commands = 1000
checkpoint_every = 1000
tick = "250ms"
# Recorded in the log on first start, with the custody chain id and vault under
# "eip712"; changing it needs a fresh log (remove data/dev/log with the node
# stopped), from which the node rebuilds the history index.
auth = "none"

# Recovery caches are optional. Pin an enclave address only after verifying its attestation.
# Only caches the current attested key signed are used; a start under a new key fails closed until
# the key persists across restarts. Empty pins use full replay.
# [snapshots]
# dir = "data/dev/snapshots"
# retain = 3
# max_bytes = 67108864
# trusted_signers = []

# Limits on the public API, served over TLS with a key generated in the enclave. A client is its
# socket peer IP (an IPv6 client by its /64), or, behind a pass-through proxy listed under
# [api.proxy_protocol], the address in the PROXY protocol v2 header it sends; forwarding headers
# are ignored.
[api]
# Keep max_connections below the process's open-file limit (`ulimit -n`).
max_connections = 512
max_connections_per_ip = 32
handshake_timeout = "10s"
read_timeout = "30s"
# Largest request body (413 when larger) and largest message a stream subscriber may send.
max_body_bytes = 65536
# A token bucket: `burst` requests at once, refilled at `per_second`. Excess requests get 429.
per_ip = { per_second = 50, burst = 100 }
# Requests that act for one account: orders, cancels, and withdrawals.
per_account = { per_second = 10, burst = 20 }
# New connections from one client, closed before the TLS handshake when over. Keep it above per_ip.
per_ip_connections = { per_second = 100, burst = 200 }
max_subscribers = 256
# The console's dev origin; the stream refuses any other browser origin.
allowed_origins = ["http://localhost:3000"]
# A client that takes longer than this to take a response, or a subscriber a message, is dropped.
send_timeout = "30s"
# A signed stream subscriber (`signed=1`) gets a signed heartbeat at least this often; at least 1s.
heartbeat_interval = "5s"
# A signed stream subscriber that asked for an account's quotes gets them again when one changes, at
# most this often (at least 100ms), for at most this many markets.
quote_interval = "100ms"
quote_max_markets = 4

# A tracing filter directive; it must enable at least "error" for engine_node,
# the level every Critical alert logs at.
[logging]
level = "info"

[tee]
provider = "mock" # "configfs_tsm" on a TDX / SEV-SNP confidential VM; SEV-SNP also needs `processor`
use_published_mock_key = true # Public development identity; forbidden with real attestation.

[operator]
rotation_enabled = false
# Signs admin commands sent with `engine admin`; recorded in the log on first
# start, with the custody chain id and vault, so changing it needs a fresh log.
# This is the public key of the local test key 0x4242…42 (32 bytes of 0x42),
# whose private key is public: local nodes only. It is listed in test-keys.toml,
# so a node whose tee.provider is not "mock" refuses it.
public_key = "0x0424653eac434488002cc06bbfb7f10fe18991e35f9fe4302dbea6d2353dc0ab1c119fc5009a032aa9fe47f5e149bb8442f71f884ccb516590686d8ff6ab91c613"

[custody]
provider = "mock"
chain_id = 31337
vault = "0x0000000000000000000000000000000000000000"

[feeds]
provider = "mock" # "venues" streams live quotes from [feeds.venues]
interval = "200ms"
mock_mids = [
  { market = 1, mid = "100000" },
  { market = 2, mid = "4000" },
  { market = 10, mid = "1.08" },
  { market = 20, mid = "6500" },
  { market = 23, mid = "23500" },
  { market = 30, mid = "2600" },
  { market = 40, mid = "230" },
]

# Live crypto venues. Every venue here quotes against USD, so the index never
# mixes quote currencies.
[feeds.venues]
timeout = "10s"
reconnect_min = "500ms"
reconnect_max = "30s"
stale_after = "1s"

[[feeds.venues.connections]]
venue = "coinbase"
url = "wss://advanced-trade-ws.coinbase.com"
symbols = [{ market = 1, symbol = "BTC-USD" }, { market = 2, symbol = "ETH-USD" }]

[[feeds.venues.connections]]
venue = "kraken"
url = "wss://ws.kraken.com/v2"
symbols = [{ market = 1, symbol = "BTC/USD" }, { market = 2, symbol = "ETH/USD" }]

[[feeds.venues.connections]]
venue = "bitstamp"
url = "wss://ws.bitstamp.net"
symbols = [{ market = 1, symbol = "btcusd" }, { market = 2, symbol = "ethusd" }]

# Trusted time. The sequencer checks every stamp against signed Roughtime readings
# (RFC 10049), and stamps nothing, genesis included, before its first sample. It
# halts when the host clock is not within `max_drift` of them, or when no sample
# has arrived for 60 seconds, and resumes once a sample is within the bound
# again. Readings carry whole seconds and a radius of a few seconds, so the
# bound is coarse.
[time]
max_drift = "15s"
interval = "10s"

# Each address and key is from the operator's own published page, cited above
# the entry, and matches the key the operator publishes in DNS TXT.
#
# int08h, https://int08h.com/post/public-roughtime-server/ (speaks 0x8000000c)
[[time.servers]]
name = "int08h"
address = "roughtime.int08h.com:2002"
public_key = "AW5uAoTSTDfG5NfY1bTh08GUnOqlRb+HVhbJ3ODJvsE="

# TimeNL, run by SIDN Labs, https://time.nl/index_en.html (speaks 0x8000000c)
[[time.servers]]
name = "TimeNL"
address = "rough.time.nl:2002"
public_key = "v2CievhgKsxzlWPwIkYFUXeA51Akhkv5uhJCj1/kbiY="

# time.txryan.com, https://time.txryan.com/ (the RFC 10049 port, speaks version 1)
[[time.servers]]
name = "txryan"
address = "time.txryan.com:5319"
public_key = "iBVjxg/1j7y1+kQUTBYdTabxCppesU/07D4PMDJk2WA="

[history]
# The account history index, derived from the log; removing the directory while
# the node is stopped rebuilds it from the log.
dir = "data/dev/history"
# Events older than this, counted back from the newest command, leave the index; the log keeps them.
retention = "365d"

# The derived marks cache every market's index-mark history is served from
# (`GET /v1/markets/{id}/marks`). Removing the directory while the node is stopped
# rebuilds it from the log; a provider backfill seeds the depth a fresh log cannot
# have. With the mock feeds above there are no venue symbols to backfill; with
# feeds.provider = "venues" the Coinbase connections' symbols backfill from the
# venue's public candles endpoint.
# [history.marks]
# How long each resolution's buckets stay, counted back from the newest mark.
# retention_1s = "48h"
# retention_1m = "60d"
# retention_1h = "2y"
# 1d buckets stay unbounded without retention_1d.
# [history.marks.backfill]
# enabled = true
# base_url = "https://api.exchange.coinbase.com"
# depth_1m = "60d"
# depth_1h = "2y"
# depth_1d = "2y"

[metrics]
listen = "127.0.0.1:9464"

[alerts]
outbox = { dir = "data/dev/alerts", max_pages = 2048, max_bytes = 16777216, max_age = "1h" }
no_price_after = "5s"
episode_quiet = "15m"
# Post Critical alerts as JSON to the URL in an environment variable:
# [alerts.critical]
# url_env = "ENGINE_ALERTS_CRITICAL_URL"

[genesis]
# Mock custody only. With EVM custody, house capital enters through vault deposits to the house.
house_capital = "10000000"
benchmarks = [
  { name = "SOFR", annual_bps = 400 },
  { name = "SONIA", annual_bps = 400 },
  { name = "ESTR", annual_bps = 200 },
]

[genesis.params]
profit_fee_bps = 1000
closeout_level_bps = 5000
house_total_cap_bps = 20000
house_total_cap_floor = "2000000"
# A fast move counts within this trailing window, and up to a tenth of it further back.
stress_move_window_ms = 60000
stress_cooldown_ms = 300000
# Most orders one account may rest at once, across every market: 1 to 1000.
max_resting_orders = 100

[genesis.params.rollover]
tz = "Europe/London"
hour = 22
minute = 0

[genesis.params.toxicity]
horizon_ms = 2000
ewma_weight_bps = 1000
tiers = [
  { min_score_bps = 5, extra_spread_bps = 1 },
  { min_score_bps = 15, extra_spread_bps = 3 },
]

# From protocol V11 a toxicity score is the notional-weighted average of an
# account's markouts, from `prior` USD of neutral history and over at most
# `memory` USD of fill notional; ewma_weight_bps applies before V11 only.
[genesis.params.toxicity.notional]
prior = "10000"
memory = "10000000"

# Level 0 is normal. Higher levels widen spreads, either automatically on
# any trigger or when the operator raises the floor. A divergence trigger is
# a share of each market's max_divergence_bps, so every market can reach each
# level: 60% and 80% are 15 and 20 bps at crypto's 25 bps bound.
[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 10000
min_spread_bps = 0

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 20000
min_spread_bps = 2
trigger = { divergence_share_bps = 6000, move_bps = 150, utilisation_bps = 8000 }

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 40000
min_spread_bps = 10
trigger = { divergence_share_bps = 8000, move_bps = 300, utilisation_bps = 9500 }

