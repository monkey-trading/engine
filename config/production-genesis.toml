# --- Close-spread ceilings (protocol V40, #344) -------------------------------
# The most each market's closing slice may pay, whatever the parameters,
# stress levels, toxicity tiers, or spread tiers do: no operator command can
# raise a close above its ceiling (#147's per-market registry; #109's bound).
# Values are #147's proposed ceilings (research/close-spread-calibration
# results/ceilings.csv), recomputed for protocol V52's floor and V54's score
# tiers: a market's launch close charge is the widest stress minimum 10bps, the
# 5bps top toxicity add-on (from V54 the score's top tier), and its first spread
# band at the widest 4x multiplier, and the engine refuses a ceiling below it.
# Each ceiling is the larger of the study's need, rounded up to 5bps, and that
# charge, rounded up to a whole bp.
