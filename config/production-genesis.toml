# Production genesis: the launch market catalogue with its venue calendars,
# margins, spreads, and financing.
#
# This file is the [genesis] section of a production node config and nothing
# else. It is protocol: on first boot the node sequences it into the public log
# as admin commands. A full config is the deployment's [node], [logging],
# [tee], [operator], [custody] and [feeds] sections followed by this file.
#
# Launch values:
# - Markets: the majors of each asset class (#7, launch markets) and 20 US
#   large-cap shares, without the Eurex and ICE markets (Germany 40, UK 100
#   and Brent), which wait for a TLS real-time source (#673).
# - Margin (#8, launch margin tables): professional-client levels, up to 200:1
#   (50 bps) on FX majors and major indices and lower on commodities, shares
#   and crypto, with bands that rise with position notional. BTC-USD and
#   ETH-USD are 100:1 (100 bps) up to $2M of notional, 2% to $10M and 5%
#   above, and SOL-USD 10:1 up to $1M and 20% above.
# - Fees (#9, launch fee schedule): a 10% profit fee, and financing markups
#   over the benchmark of 2.5% for indices, commodities and shares, 1% for FX,
#   and 5% for crypto. From protocol V55 the profit fee falls with holding
#   time (#614, decisions D3 and D7, revised 2026-11-13): the whole gain on a
#   hold up to 10 s, falling to the 10% at 15 minutes along profit_fee_curve.
# - Size spreads (#614, decisions D1, D2 and D6): #623's calibrated tiers
#   (research/spread-calibration/results/spread_tiers.toml), in tenths of a bp
#   from protocol V52, each band twice the one before, paid by every fill on
#   the slice it opens or closes. FX and index first bands are the tenths D6
#   derives from #623's 3s moves (0.4bp on EUR-USD and GBP-USD, 0.5 on USD-JPY
#   and AUD-USD, 0.7 on US500 and US30, 0.9 on US100, 1.0 on JP225), PENDING
#   THE OWNER'S CONFIRMATION before promotion; another choice changes this
#   genesis and the ceilings below.
# - Stress levels and the other protocol parameters are config/dev.toml's
#   (#9). A market dev.toml does not list takes its asset class's slippage
#   bound, price rules, margin tables and house cap, except SOL-USD's house
#   cap (10% of house NAV, set here below BTC's 30% and ETH's 20%) and its
#   margin (10:1 where BTC-USD and ETH-USD are 100:1).
#   Each market's financing benchmark is the rate of its base or index
#   currency, as dev.toml's EUR-USD uses ESTR, with that rate's day basis.
# - Margin and spread bands and house caps are in USD notional. Japan 225
#   is quoted in JPY at its venue (quote_currency). Its profit and loss
#   accrues in that currency and converts to USD at the engine's own USD-JPY
#   price, which is listed before it.
# - Futures (#32): from protocol V21 the index and commodity markets (ids
#   20-22, 25 and 30-32) price from their front futures contract. The index is
#   the front contract's median plus the sum of every roll's gap (additive
#   adjustment). Each listing's `contracts` names its contracts in roll order,
#   with the time the index rolls onto each, through early 2028; a relisting
#   adds the next before the last becomes the front. A contract's name is its
#   exchange root and month code: CME ES, NQ, YM, NIY, GC, SI and CL. The roll
#   rules, decided by
#   the owner on 2026-10-25, follow exchange conventions:
#   - Index futures roll 8 calendar days before quarterly expiry, at 14:30
#     UTC on the Thursday before the third Friday of March, June, September
#     and December. Japan 225 prices from CME's yen Nikkei (NIY), which
#     expires a week earlier, when Osaka sets its final settlement on the
#     second Friday, so it rolls on the Thursday before that, at 01:00 UTC in
#     Osaka's day session.
#   - Gold and silver roll 2 business days before first notice, the last
#     business day of the month before delivery, at 14:30 UTC, between active
#     months only: gold's Feb, Apr, Jun, Aug, Oct and Dec, silver's Mar, May,
#     Jul, Sep and Dec.
#   - WTI rolls 2 business days before last trade, every month, at 14:30 UTC.
#     Its last trade is 3 business days before the 25th of the month before
#     delivery, or 4 when the 25th is not a business day.
#   Business days are the exchange's: CME's exclude US holidays.
# - Benchmark rates are supplied by the separate signed publisher worker (#33).
#   Complete the node config with config/benchmark-publishers.toml and run the worker
#   before serving. With no rate, a market accrues no financing and raises a Critical alert.
# - Toxicity (#690): from protocol V54, the score's tiers are #614's decision
#   D1, and each listing's markout_floor_bps is the market's year's markout
#   spread, rounded up to a hundredth of a bp (#699,
#   research/spread-calibration/results/markout_floors.md).
# - house_capital is 0: the house starts with no capital and builds it from
#   trader losses. Genesis records a zero house capital credit, which moves no
#   cash and marks genesis done, so the vault holds only trader deposits.
# - Each exposure cap is the larger of its share of house NAV and a dollar
#   floor (house_cap_floor per market, house_total_cap_floor in total), so
#   trading can start from a zero house (#15 §2). The floors are not set here
#   yet: until they are, every cap is zero at zero NAV, so this genesis admits
#   no opening trade, and house utilisation reads as full, so every priced
#   market sits at the top stress level. Each floor must cover the stress
#   trigger too.
#
# Calendars. Each schedule uses its venue's time zone. `windows` are the weekly
# sessions, `closed_dates` whole local days the venue is shut, `closures`
# dated local [from, to) periods inside the windows (early closes, holiday
# halts, and closures that run past midnight), and `special_sessions` dated
# local periods the venue trades outside the windows. Closures and special
# sessions need protocol version V4, which the node activates before it
# sequences genesis. After launch, a calendar change is an UpsertMarket admin
# command carrying the market's new schedule; it applies from the seq it is
# sequenced at. A running node takes admin commands through the operator
# command channel (#47).
#
# Sourcing, as read on 2026-10-20 and re-read against the venues' own files on
# 2026-10-29 (#107). A venue's own publication decides, checked
# against a second, independent source. Where the venue has published nothing,
# two independent sources must agree; where they disagree, the schedule closes
# at the earliest time any of them gives. The independent sources are
# government holiday lists and two open-source calendar libraries,
# pandas_market_calendars 5.5.0 and exchange_calendars 4.13.2. Each venue below
# lists what is NOT VERIFIED by two sources.
#
# - US shares (ids 40-59): NYSE core session 09:30-16:00 ET, with its 2026 and
#   2027 holidays and 13:00 early closes:
#   https://www.nyse.com/markets/hours-calendars
#   Nasdaq observes the same holidays and publishes the same 2026 dates,
#   https://www.nasdaqtrader.com/Trader.aspx?id=Calendar ; its 2027 calendar
#   is not out. Both libraries (NYSE, NASDAQ, XNYS, XNAS) give the same hours,
#   holidays and early closes for both years. NYSE observes no New Year's Day
#   holiday on 31 Dec 2027, as 1 Jan 2028 is a Saturday.
# - FX (ids 10-13): Cboe FX spot, Sunday 17:00 to Friday 17:00 ET, closed on
#   Christmas Day and New Year's Day:
#   https://cdn.cboe.com/resources/fx/operation.pdf (section 22) and
#   https://www.cboe.com/about/hours/fx
#   pandas_market_calendars' FX calendar gives the same week, and its CME FX
#   calendar shuts from 17:00 ET the evening before 25 Dec 2026, 1 Jan 2027
#   and 24 Dec 2027 (Christmas Day on a Saturday). Cboe's trading day starts
#   at 17:00 ET, and it has not said whether a holiday closure follows it or
#   how it treats Christmas Day on a Saturday, so the schedule takes the
#   earlier close: shut from 17:00 ET the evening before each of those days.
#   Re-read on 2026-10-29: Cboe FX's Operating Procedures (effective
#   16 Oct 2026, section 22) and its hours page say only that the week runs
#   Sunday 17:00 to Friday 17:00 ET and the platform is closed on Christmas Day
#   and New Year's Day (25 December, 1 January); neither says when a closure
#   starts or how a Saturday Christmas is treated.
#   Re-read on 2026-11-12: the same operating procedures (effective 16 Oct 2026)
#   and the hours page, unchanged, give no closure start or Saturday rule.
#   NOT VERIFIED: that 17:00 ET start of each closure, and the closure on
#   24 Dec 2027.
# - US 500, US Tech 100, Wall St 30 (ids 20-22) and gold, silver, WTI
#   (ids 30-32): CME Globex, Sunday to Friday 17:00-16:00 CT with a daily
#   16:00-17:00 break, as CME's E-mini S&P 500, gold and crude oil pages give
#   it in search-engine excerpts and pandas_market_calendars (CME Globex
#   Equity, CMEGlobex_GC, _SI, _CL) gives it too:
#   https://www.cmegroup.com/trading-hours.html
#   CME finalises each holiday's hours about two weeks before it, so none for
#   2026-2027 is published. Both libraries (pandas_market_calendars and
#   exchange_calendars' CMES, COMEX and NYMEX) shut all six markets on
#   25 Dec 2026, 1 Jan 2027 and 24 Dec 2027, and metals and energy on Good
#   Friday 2027. They halt equity at 12:00 CT on Thanksgiving and on MLK,
#   Presidents', Memorial, Independence and Labor Days, and metals and energy
#   at 12:00 CT on Labor Day.
#   CME's site refused automated reads on 2026-10-29 (HTTP 403), so no
#   holiday hours could be read from it; the first, Thanksgiving 2026, should
#   be out about two weeks ahead. Re-tried on 2026-11-12: cmegroup.com still
#   refused automated reads (HTTP 403, including its 2026 Thanksgiving clearing
#   advisory), and only third-party summaries, which disagree (12:00 or 12:15 CT
#   for equity, 12:30 or 13:30 CT for metals and energy), carry Thanksgiving's
#   hours, so nothing is verified and the closures below are unchanged.
#   NOT VERIFIED, the libraries disagree and the schedule takes the earliest:
#   equity on 27 Nov 2026, 24 Dec 2026 and 26 Nov 2027 (12:00 or 12:15 CT),
#   Juneteenth 2027 (12:00 CT or no halt) and Good Friday 2027 (shut, or open
#   until 08:15 CT); metals and energy halts on every other holiday (12:00 CT,
#   or 12:45-13:45 CT) and on Juneteenth 2027 (13:30 CT, one library only).
# - Japan 225 (id 25): Osaka Exchange Nikkei 225 Futures, day session
#   08:45-15:45 and night session 17:00-06:00 Tokyo, as JPX's trading hours
#   page (updated 13 Apr 2026) gives them (opening auctions 08:45 and 17:00,
#   closing auctions 15:45 and 06:00) and QUICK gives them:
#   https://www.jpx.co.jp/english/derivatives/rules/trading-hours/index.html
#   https://corporate.quick.co.jp/en/japanmarketsview/equity/one-month-to-extension-of-tokyo-stock-exchange-trading-hours-new-market-close-system-to-be-introduced/
#   Japan's national holidays are the Cabinet Office's,
#   https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv , and JPX shuts
#   from 31 Dec to 3 Jan; both libraries' Tokyo calendars (JPX, XTKS) give the
#   same holidays and year-end. Closed 23 Nov 2026 and 20 Sep 2027 (BCP
#   tests), 31 Dec 2026 to 3 Jan 2027, and 31 Dec 2027.
#   Read on 2026-10-29 from JPX's holiday trading page (updated 26 Jun 2026):
#   https://www.jpx.co.jp/english/derivatives/rules/holidaytrading/index.html
#   index futures trade both sessions on every national holiday except
#   23 Nov 2026 and 20 Sep 2027 (BCP tests) and 31 Dec; 2026 and 2027 up to
#   May are finalized, and the national holidays match the Cabinet Office's.
#   JPX's market holidays page (updated 6 Feb 2026) says the night session
#   runs after every business day, including one before a Saturday or a
#   closed day, and not after a non-business day:
#   https://www.jpx.co.jp/english/corporate/about-jpx/calendar/index.html
#   so the sessions before each closure run, as the schedule has them. That
#   page ends the night session at 5:30, against 06:00 on the hours page,
#   which the schedule follows.
#   NOT VERIFIED: that holiday trading days from July 2027 hold, as they are
#   scheduled until JPX finalizes them in December 2026; and whether the
#   Friday night sessions before the BCP tests run, on which JPX says nothing
#   beyond the rule above, which the schedule follows.

[genesis]
house_capital = "0"

[genesis.params]
profit_fee_bps = 1000
closeout_level_bps = 5000
house_total_cap_bps = 20000
# A fast move counts within this trailing window, and up to a tenth of it further back.
stress_move_window_ms = 60000
stress_cooldown_ms = 300000
# Most orders one account may rest at once, across every market: 1 to 1000.
max_resting_orders = 100
# From protocol V55 a realised gain pays the larger of profit_fee_bps and this
# curve's fee at the hold of the slice it closes (hold_ms from the position's
# open time, fee_bps of the gain): the whole gain to 10 s, falling to 10% at 15
# minutes, linear between points with the fee rounded up to the bp, and zero
# from the last hold, where profit_fee_bps alone applies (#614's decision of
# 2026-11-13; #697's 10 s curve, eleven holds spaced evenly in its logarithm).
profit_fee_curve = [
  { hold_ms = 10000, fee_bps = 10000 },
  { hold_ms = 15683, fee_bps = 9100 },
  { hold_ms = 24596, fee_bps = 8200 },
  { hold_ms = 38573, fee_bps = 7300 },
  { hold_ms = 60492, fee_bps = 6400 },
  { hold_ms = 94869, fee_bps = 5500 },
  { hold_ms = 148781, fee_bps = 4600 },
  { hold_ms = 233330, fee_bps = 3700 },
  { hold_ms = 365927, fee_bps = 2800 },
  { hold_ms = 573877, fee_bps = 1900 },
  { hold_ms = 900000, fee_bps = 1000 },
]

[genesis.params.rollover]
tz = "Europe/London"
hour = 22
minute = 0

[genesis.params.toxicity]
# From protocol V54 the score is how many standard errors an account's
# decayed, size-capped markout edge sits above zero, each markout in units of
# its market's markout spread (markout_floor_bps on each listing) over the
# protocol's 5 s horizon, with a 7-day half-life and no tier before 20 decayed
# fills. The tiers are #614's decision D1, from #623's calibration: scores of
# 4 and 8 add 2 and 5 bps. ewma_weight_bps applies before V11, and `notional`
# before V54.
horizon_ms = 5000
ewma_weight_bps = 1000
score_tiers = [
  { min_score = "4", extra_spread_bps = 2 },
  { min_score = "8", extra_spread_bps = 5 },
]

# Before protocol V54 a toxicity score is the notional-weighted average of an
# account's markouts, from `prior` USD of neutral history and over at most
# `memory` USD of fill notional (from V11).
# Calibrated (#130): memory keeps the score's sampling drift under 1 bp at
# every market's p99 fill size (Brent binds, at its 1.06 bps markout scale);
# prior is half of memory, enough neutral history that a new account's first
# fills move its score only modestly while the toxic climb still lands well
# inside the candidate fill counts. The study's market set includes Brent, which
# launch defers (#673), so the values hold with margin on the launch set.
[genesis.params.toxicity.notional]
prior = "5629518"
memory = "11259036"

# Level 0 is normal. Higher levels widen spreads automatically on any trigger;
# the operator's floor reaches level 1 alone, and lapses after 72 hours, from
# protocol V46. A divergence trigger is
# a share of each market's max_divergence_bps, so every market can reach each
# level: 60.01% and 95% fire at 16 and 24 bps at crypto's 25 bps bound.
# Calibrated by research/cap-calibration's stress stage (#133): the level-1
# divergence share is the lowest whose stale-fill loss at fire covers the
# level's spread on the tightest bound (6001 is the lowest share the engine's
# truncated-share arithmetic fires at 4 bps on the 5-bps markets); the level-2
# share is the fallback, its cost criterion infeasible on the tightest markets;
# the move thresholds keep every market's level-1 time under 5% and the
# flow-weighted under 1% on minute-scale simulations of the markets' own hours;
# the utilisation levels keep the flow-weighted fire rate under 2% per
# launch-relevant floor family in the Monte Carlo. See the research README.
[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 10000
min_spread_bps = 0

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 20000
min_spread_bps = 2
trigger = { divergence_share_bps = 6001, move_bps = 75, utilisation_bps = 7000 }

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 40000
min_spread_bps = 10
trigger = { divergence_share_bps = 9500, move_bps = 200, utilisation_bps = 9500 }

