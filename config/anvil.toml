# Local EVM custody against Anvil: mock TEE and feeds, with the vault and a mock USDC on a local
# chain. `scripts/dev-vault-deposits.sh` starts Anvil, deploys both contracts from Anvil's first
# account (so they land at the addresses below), and runs the deposit scenario against this node.
#
# Genesis credits no house capital: it enters through vault deposits to the house.

[node]
listen = "127.0.0.1:8080"
log_dir = "data/anvil/log"
segment_commands = 1000
checkpoint_every = 1000
tick = "250ms"
# Signed requests: unsigned ones need mock custody. Recorded in the log on first start, with the
# custody chain id and vault under "eip712"; changing it needs a fresh log.
auth = "eip712"

# Limits on the public API, served over TLS with a key generated in the enclave. A client is its
# socket peer IP (an IPv6 client by its /64); forwarding headers are ignored.
[api]
# Keep max_connections below the process's open-file limit (`ulimit -n`).
max_connections = 512
max_connections_per_ip = 32
handshake_timeout = "10s"
read_timeout = "30s"
# Largest request body (413 when larger) and largest message a stream subscriber may send.
max_body_bytes = 65536
# A token bucket: `burst` requests at once, refilled at `per_second`. Excess requests get 429.
per_ip = { per_second = 50, burst = 100 }
# Requests that act for one account: orders, cancels, and withdrawals.
per_account = { per_second = 10, burst = 20 }
# New connections from one client, closed before the TLS handshake when over. Keep it above per_ip.
per_ip_connections = { per_second = 100, burst = 200 }
max_subscribers = 256
quote_interval = "100ms"
quote_max_markets = 4
# The console's dev origin; the stream refuses any other browser origin.
allowed_origins = ["http://localhost:3000"]
# A client that takes longer than this to take a response, or a subscriber a message, is dropped.
send_timeout = "30s"

[history]
# The account history index, derived from the log; removing the directory while
# the node is stopped rebuilds it from the log.
dir = "data/anvil/history"
# Events older than this, counted back from the newest command, leave the index; the log keeps them.
retention = "365d"

[logging]
level = "info"

[tee]
provider = "mock"
use_published_mock_key = true # Public development identity; forbidden with real attestation.

[operator]
rotation_enabled = false
# The public key of the local test key 0x4242…42 (32 bytes of 0x42), whose private key is public:
# local nodes only, and listed in test-keys.toml. Recorded in the log on first start.
public_key = "0x0424653eac434488002cc06bbfb7f10fe18991e35f9fe4302dbea6d2353dc0ab1c119fc5009a032aa9fe47f5e149bb8442f71f884ccb516590686d8ff6ab91c613"

[custody]
provider = "evm"
chain_id = 31337
vault = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"

[custody.evm]
# Three local proxies to the same Anvil chain; production uses independent operators.
providers = [
  { name = "local-a", rpc_url = "http://127.0.0.1:8545" },
  { name = "local-b", rpc_url = "http://127.0.0.1:8546" },
  { name = "local-c", rpc_url = "http://127.0.0.1:8547" },
]
usdc = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
# Anvil started with `--slots-in-an-epoch 1` marks the block below the head safe, so a deposit is
# eligible for credit three blocks after it is mined. Production uses latest for credit.
finality_tag = "safe"
# Principal unlocks separately at Ethereum finality; mock TEE configs may choose other tags.
withdrawal_finality_tag = "finalized"
confirmations = 2
start_block = 0
max_block_range = 1000
poll_interval = "200ms"
rpc_timeout = "5s"
stall_critical_after = "5m"
# Anvil marks the finalized tag at once; production sizes this for the release tag's
# cadence — on Arbitrum One, one Ethereum finality period past batch posting.
finality_stalled_after = "5m"
cursor_path = "data/anvil/custody-cursor.json"

[feeds]
provider = "mock"
# The mock feed's tick, and the most often a venue feed sequences one symbol's latest quote:
# venue feeds sequence a quote per book update, and updates closer together than this coalesce.
interval = "10ms"
mock_mids = [
  { market = 1, mid = "100000" },
  { market = 2, mid = "4000" },
]

# Trusted time. The sequencer checks every stamp against signed Roughtime readings
# (RFC 10049), and stamps nothing, genesis included, before its first sample. It
# halts when the host clock is not within `max_drift` of them, or when no sample
# has arrived for 60 seconds, and resumes once a sample is within the bound
# again. Readings carry whole seconds and a radius of a few seconds, so the
# bound is coarse.
[time]
max_drift = "15s"
interval = "10s"

# Each address and key is from the operator's own published page, cited above
# the entry, and matches the key the operator publishes in DNS TXT.
#
# int08h, https://int08h.com/post/public-roughtime-server/ (speaks 0x8000000c)
[[time.servers]]
name = "int08h"
address = "roughtime.int08h.com:2002"
public_key = "AW5uAoTSTDfG5NfY1bTh08GUnOqlRb+HVhbJ3ODJvsE="

# TimeNL, run by SIDN Labs, https://time.nl/index_en.html (speaks 0x8000000c)
[[time.servers]]
name = "TimeNL"
address = "rough.time.nl:2002"
public_key = "v2CievhgKsxzlWPwIkYFUXeA51Akhkv5uhJCj1/kbiY="

# time.txryan.com, https://time.txryan.com/ (the RFC 10049 port, speaks version 1)
[[time.servers]]
name = "txryan"
address = "time.txryan.com:5319"
public_key = "iBVjxg/1j7y1+kQUTBYdTabxCppesU/07D4PMDJk2WA="

[metrics]
listen = "127.0.0.1:9464"

[alerts]
outbox = { dir = "data/anvil/alerts", max_pages = 2048, max_bytes = 16777216, max_age = "1h" }
no_price_after = "5s"
episode_quiet = "15m"
# Custody other than the mock needs a Critical route: the URL comes from this environment variable.
[alerts.critical]
url_env = "ENGINE_ALERTS_CRITICAL_URL"

[genesis]
house_capital = "0"
benchmarks = [
  { name = "SOFR", annual_bps = 400 },
]

[genesis.params]
profit_fee_bps = 1000
closeout_level_bps = 5000
house_total_cap_bps = 20000
# A fast move counts within this trailing window, and up to a tenth of it further back.
stress_move_window_ms = 60000
stress_cooldown_ms = 300000

[genesis.params.rollover]
tz = "Europe/London"
hour = 22
minute = 0

[genesis.params.toxicity]
horizon_ms = 2000
ewma_weight_bps = 1000
tiers = [
  { min_score_bps = 5, extra_spread_bps = 1 },
  { min_score_bps = 15, extra_spread_bps = 3 },
]

# From protocol V11 a toxicity score is the notional-weighted average of an
# account's markouts, from `prior` USD of neutral history and over at most
# `memory` USD of fill notional; ewma_weight_bps applies before V11 only.
[genesis.params.toxicity.notional]
prior = "10000"
memory = "10000000"

# Level 0 is normal. Higher levels widen spreads, either automatically on
# any trigger or when the operator raises the floor. A divergence trigger is
# a share of each market's max_divergence_bps, so every market can reach each
# level: 60% and 80% are 15 and 20 bps at crypto's 25 bps bound.
[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 10000
min_spread_bps = 0

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 20000
min_spread_bps = 2
trigger = { divergence_share_bps = 6000, move_bps = 150, utilisation_bps = 8000 }

[[genesis.params.stress_levels]]
size_spread_multiplier_bps = 40000
min_spread_bps = 10
trigger = { divergence_share_bps = 8000, move_bps = 300, utilisation_bps = 9500 }

# --- Crypto: 24/7 ---------------------------------------------------------

[[genesis.markets]]
id = 1
symbol = "BTC-USD"
asset_class = "crypto"
max_slippage_bps = 25
house_cap_bps = 3000
margin_tiers = [{ up_to = "1000000", bps = 1000 }, { bps = 2000 }]
spread_tiers = [{ up_to = "2000000", bps = 0 }, { up_to = "10000000", bps = 3 }, { bps = 8 }]
schedule = { kind = "always_open" }
price_rules = { max_age_ms = 1000, max_divergence_bps = 25, min_sources = 2 }
financing = { benchmark = "SOFR", markup_bps = 500, day_basis = 365 }

[[genesis.markets]]
id = 2
symbol = "ETH-USD"
asset_class = "crypto"
max_slippage_bps = 25
house_cap_bps = 2000
margin_tiers = [{ up_to = "1000000", bps = 1000 }, { bps = 2000 }]
spread_tiers = [{ up_to = "1000000", bps = 0 }, { up_to = "5000000", bps = 3 }, { bps = 8 }]
schedule = { kind = "always_open" }
price_rules = { max_age_ms = 1000, max_divergence_bps = 25, min_sources = 2 }
financing = { benchmark = "SOFR", markup_bps = 500, day_basis = 365 }

# --- Close-spread ceilings (protocol V40, #344) -------------------------------
# Unequal TEST FIXTURES, not calibrated values: production's come from #147's
# calibration. The launch close charge (widest stress minimum 10bps plus the
# 3bps top toxicity add-on) is 13bps.
[[genesis.close_spread_ceilings]]
market = 1
max_close_spread_bps = 30

[[genesis.close_spread_ceilings]]
market = 2
max_close_spread_bps = 30
