[[feeds.venues.connections]]
venue = "kraken"
url = "wss://ws.kraken.com/v2?connection=2"
symbols = [{ market = 1, symbol = "BTC/USD" }, { market = 2, symbol = "ETH/USD" }, { market = 3, symbol = "SOL/USD" }]

# Trusted time: a strict majority of these independent servers must agree. The attestation binds
# this file, so a verifier checks the keys against a published copy.
[time]
max_drift = "15s"
interval = "10s"

[[time.servers]]
name = "int08h"
address = "roughtime.int08h.com:2002"
public_key = "AW5uAoTSTDfG5NfY1bTh08GUnOqlRb+HVhbJ3ODJvsE="

[[time.servers]]
name = "TimeNL"
address = "rough.time.nl:2002"
public_key = "v2CievhgKsxzlWPwIkYFUXeA51Akhkv5uhJCj1/kbiY="

[[time.servers]]
name = "txryan"
address = "time.txryan.com:5319"
public_key = "iBVjxg/1j7y1+kQUTBYdTabxCppesU/07D4PMDJk2WA="

# No [snapshots]: a first release creates the enclave key, which [snapshots] trusted_signers must pin, so
# every start of this release replays the whole log. A later release adds the section from the
# template, pinning the enclave address the running release attests (deploy-and-rollback.md).

# The engine's state at the first checkpoint the node writes on each UTC day, served beside the archive at
# /v1/archive/snapshots/, from which `engine replay --snapshots` replays the log's days in parallel.
# About 420 MB a day at 100k accounts; every day's is kept.
[daily_snapshots]
dir = "/data/daily-snapshots"

[history]
dir = "/data/history"
retention = "365d"

# Plain HTTP, no per-account data. Listen on an address only the monitoring network reaches.
[metrics]
listen = "0.0.0.0:9464"

[alerts]
outbox = { dir = "/data/alerts", max_pages = 2048, max_bytes = 16777216, max_age = "1h" }
no_price_after = "5s"
episode_quiet = "15m"

# The webhook URLs are credentials: the operator delivers them.
[alerts.critical]
url_secret = "alerts_critical_url"

[alerts.warning]
url_secret = "alerts_warning_url"

# The signed screening source. Its signing authority and freshness bound are recorded once in the
# log. Without this section the actions it screens are refused. See config/access-source.md.
[access]
source = "0x6666666666666666666666666666666666666666" # REPLACE: the screening authority's address
endpoint = "https://screening.example.com/v1/{screening_key}" # REPLACE
timeout = "2s" # OWNER
max_age = "30s" # OWNER
max_response_bytes = 4096
# Requests waiting on the source at once: ten times launch flow's screened requests, 68 a second
# rounded up, each held for the whole `timeout`. A production build refuses fewer than 68 a second of
# `timeout`.
max_in_flight = 136
# Of those slots, the most one account's requests, or one client's, may hold, and how many only
# requests the account's state shows can reduce risk may take, one at a time for an account: closes,
# close-alls, take-profit and stop-loss requests, withdrawals and payout reissues. A production build
# refuses shares above these values and a smaller reserve.
max_in_flight_per_account = 2
max_in_flight_per_client = 4
reserved_in_flight = 2

