      - name: Run the minute-scale liveness dev scenario
        run: ./scripts/dev-liveness.sh
      - name: Run the operator faults dev scenario
        run: ./scripts/dev-operator-faults.sh

  # A development build with five-minute operator turns (`short-turns`), a feature set apart from every
  # other job's: a production build's refusal of it, its clippy, its turn tests, and its scenario on
  # real nodes.
  dev-short-turns:
    needs: changes
    if: needs.changes.outputs.short_turns == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      # The dependencies come from the shared cache the other jobs keep fresh; the engine's own crates
      # compile under this job's features, so it saves nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: false
      - uses: ./.github/actions/install-foundry
      - name: Install contract dependencies
        working-directory: contracts
        run: ../image/retry forge soldeer install
      # One small contract, so its compile fetches the pinned solc under `retry` before any build.
      - name: Fetch the Solidity compiler
        working-directory: contracts
        run: ../image/retry forge build src/ArbSys.sol
      - name: Refuse short turns in a production build
        run: |
          for features in production,short-turns production,engine-core/short-turns; do
            if cargo check -p engine-node --features "$features" --locked 2> refused.log; then
              echo "::error::a production build compiled with $features"
              exit 1
            fi
            grep -q "a production build refuses the short-turns feature" refused.log || { cat refused.log; exit 1; }
          done
      - name: Lint the short-turns build
        run: cargo clippy -p engine-core -p engine-node --features engine-node/short-turns --all-targets --locked -- -D warnings
      - name: Test the short-turns build's turns
        run: |
          cargo test -p engine-core --features short-turns --locked --test short_turns
          cargo test -p engine-node --features short-turns --locked --lib -- seed_relay::schedule liveness::chain::tests custody::tests::staking the_handover_grace_windows a_turn_has_begun_from_its_boundary
      - name: Run the short turns dev scenario
        run: ./scripts/dev-short-turns.sh

  # Builds the node and the scenario tools once, for the scenarios that only run them. Each of those
  # used to compile the same binary, about seven minutes apiece. It runs when any of them does.
  engine-build:
    needs: changes
    if: needs.changes.outputs.engine_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the node and the scenario tools
        run: |
          cargo build --locked -p engine-node
          cargo build --locked -p engine-node --example access_source
          cargo build --locked -p engine-core --example sign_request
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-build
          path: |
            target/debug/engine
            target/debug/examples/access_source
            target/debug/examples/sign_request
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

  dev-metrics-alerts:
