  # The node load scenario at a tenth of the launch book, a tenth of its traders and a sixteenth of its
  # stream subscribers, so the runner's four cores hold the node, its stand-ins and the generator: the
  # launch-flow and ten-times legs, two minutes each. The full-scale run and the ramp run by hand.
  dev-load:
    needs: changes
    if: needs.changes.outputs.node_load == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: false
          cache-on-failure: true
      - name: Run the node load dev scenario at 10,000 accounts
        env:
          LOAD_ACCOUNTS: "10000"
          LOAD_TRADERS: "200"
          LOAD_SUBSCRIBERS: "16"
          ENGINE_BENCH_SCALE_TO_RUNNER: "1"
        run: ./scripts/dev-load.sh

  # The soak at the load scenario's 10,000 accounts: nine minutes at ten times launch flow in three
  # intervals, each of #867's faults once a minute in turn, and a restart from the newest cache every
  # 2.4 minutes, a drain and a crash in turn. It tests the harness; the full soak runs by hand.
  dev-soak:
    needs: changes
    if: needs.changes.outputs.soak == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: false
          cache-on-failure: true
      - name: Run the soak dev scenario at 10,000 accounts
        env:
          LOAD_ACCOUNTS: "10000"
          LOAD_TRADERS: "200"
          LOAD_SUBSCRIBERS: "16"
          ENGINE_BENCH_SCALE_TO_RUNNER: "1"
          SOAK_HOURS: "0.15"
          SOAK_REPORT_MINUTES: "3"
          SOAK_FAULT_MINUTES: "1"
          SOAK_RESTART_HOURS: "0.04"
          SOAK_WINDOW_SECS: "20"
          SOAK_SHORT: "1"
          SOAK_KNOWN_ALERTS: "snapshot_write_failed"
        run: ./scripts/dev-soak.sh

  # The recovery scenario at a tenth of the launch book and its traders, on twenty minutes of launch flow
  # from 20:57 UTC, across the US shares' close, and one minute of ten times it, in which the first
  # emission period and staking epoch end and which the node's authenticated history indexes before its
  # cache, with tails of 64 KiB and 1 MiB. The full-scale run is by hand.
  dev-recovery-scale:
    needs: changes
    if: needs.changes.outputs.recovery_scale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
