      - name: Run the operator election dev scenario
        run: ./scripts/dev-operator-election.sh
      - name: Run the staking reads dev scenario
        run: ./scripts/dev-staking-reads.sh
      - name: Run the seed relay dev scenario
        run: ./scripts/dev-seed-relay.sh
      - name: Run the operator's share dev scenario
        run: ./scripts/dev-operator-share.sh
      - name: Run the standby operator dev scenario
