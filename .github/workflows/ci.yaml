name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  file-loc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check max file length
        run: ./scripts/check-file-loc.sh

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked
      - name: Check sequencer command latency at 100k accounts
        run: cargo test -p engine-core --test hot_path_benchmark --locked -- --ignored --nocapture
      - name: Test the node's production build
        run: cargo test -p engine-node --features production --locked --lib production_build

  # Every committed reference log must replay to its roots, and the accounting invariants must hold,
  # on x86_64 and aarch64. The `test` job runs both suites on x86_64 Linux, and this job on aarch64
  # Linux. No job runs on macOS: engine-core uses only integer fixed-point maths, with no floats or
  # OS calls, and macOS runs on the same two architectures.
  reference-logs:
    name: reference-logs (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Replay reference logs
        run: cargo test -p engine-core --locked --test reference_logs
      - name: Check accounting invariants
        if: ${{ !cancelled() }}
        run: cargo test -p engine-core --locked --test invariants

  reference-logs-frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed reference logs are unchanged
        env:
          # A PR against its base, a push against the commit it replaced, a manual run against main.
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'push' && github.event.before
            || 'origin/main' }}
        run: ./scripts/check-reference-logs.sh "$BASE"

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
          cache: false
      - name: Install dependencies
        run: forge soldeer install
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test

  dev-vault-deposits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
          cache: false
      - name: Install contract dependencies
        working-directory: contracts
        run: forge soldeer install
      - name: Run the vault deposit and RPC quorum dev scenario
        env:
          RPC_QUORUM_SCENARIO: "1"
          RPC_A_PORT: "8546" # Exercise a destination matching provider B's original config port.
        run: ./scripts/dev-vault-deposits.sh
      - name: Run the checkpoint dev scenario
        run: ./scripts/dev-checkpoints.sh

  dev-metrics-alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the metrics and alert routing dev scenario
        run: ./scripts/dev-metrics-alerts.sh

  dev-alert-outbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the durable alert outbox kill/restart dev scenario
        run: ./scripts/dev-alert-outbox.sh

  # Builds the enclave image twice on separate runners with no shared cache, then boots it under
  # QEMU: the production image must refuse mock providers, and the dev image must attest its config
  # hash. `image-compare` fails if the two builds differ by a single byte.
  image:
    name: image (${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: ./scripts/build-image.sh out/image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.run }}
          path: out/image/
          retention-days: 14
          if-no-files-found: error
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 xxd
      - name: Boot the image and check it refuses mock providers
        run: ./scripts/check-image.sh out/image
      - name: Build the dev image
        if: matrix.run == 'second'
        run: ./scripts/build-image.sh --variant dev out/image-dev
      - name: Boot the dev image and check its attestation
        if: matrix.run == 'second'
        run: ./scripts/check-image.sh out/image-dev

  image-compare:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
      - name: Compare the two builds
        run: |
          (cd image-first && sha256sum -c SHA256SUMS)
          (cd image-second && sha256sum -c SHA256SUMS)
          diff image-first/SHA256SUMS image-second/SHA256SUMS
          cat image-first/SHA256SUMS image-first/measurement.json

  # The single check to require in branch rules. It runs even when a job it needs fails or is
  # skipped, and passes only if every one of them succeeded. Add every new job to `needs`.
  ci-passed:
    if: always()
    needs: [fmt, file-loc, clippy, test, reference-logs, reference-logs-frozen, cargo-deny, contracts, dev-vault-deposits, dev-metrics-alerts, dev-alert-outbox, image, image-compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'length > 0 and all(. == "success")'
