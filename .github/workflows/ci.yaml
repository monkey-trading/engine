      - name: Run the exit against the last posted root on Anvil
        run: ./scripts/dev-exit.sh
      - name: Run the API and direct-vault access enforcement dev scenario
        run: ./scripts/dev-access-enforcement.sh
      - name: Run the executable quotes dev scenario
        run: ./scripts/dev-quotes.sh

  dev-daily-rotation:
    needs: changes
    if: needs.changes.outputs.daily_rotation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/install-foundry
      - name: Install contract dependencies
        working-directory: contracts
        run: ../image/retry forge soldeer install
      # One small contract, so its compile fetches the pinned solc under `retry` before any build.
      - name: Fetch the Solidity compiler
        working-directory: contracts
        run: ../image/retry forge build src/ArbSys.sol
      - name: Run the daily rotation dev scenario
