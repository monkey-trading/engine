  # The dev scenarios that are engine-node lib tests on deterministic time, which `test` also runs,
  # here by name under engine-node's own features, and the latency budgets at 100k accounts. They share
  # one build of the node's tests; each scenario takes a second or two.
  dev-scenario-tests:
    needs: changes
    if: needs.changes.outputs.scenario_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Scales the 100k-account benchmarks' bars by this runner's measured speed (#1119); nowhere else is a bar scaled.
    env:
      ENGINE_BENCH_SCALE_TO_RUNNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: false
          cache-on-failure: true
      - name: Run the signed corporate-action dev scenario
        run: ./scripts/dev-corporate-actions.sh
      - name: Run the operator bounds dev scenario
        run: ./scripts/dev-operator-bounds.sh
      - name: Run the parameter notice dev scenario
        run: ./scripts/dev-params-notice.sh
      - name: Run the holding-time fee dev scenario
        run: ./scripts/dev-holding-fee.sh
      - name: Run the volume tier dev scenario
        run: ./scripts/dev-volume-tiers.sh
      - name: Run the weekend margin dev scenario
        run: ./scripts/dev-weekend-margin.sh
      - name: Run the earned leverage dev scenario
        run: ./scripts/dev-earned-leverage.sh
      - name: Run the tier limits dev scenario
        run: ./scripts/dev-tier-limits.sh
      - name: Run the volume benefits dev scenario
        run: ./scripts/dev-volume-benefits.sh
      - name: Run the portfolio margin dev scenario
        run: ./scripts/dev-portfolio-margin.sh
      - name: Run the position levels dev scenario
        run: ./scripts/dev-position-levels.sh
      - name: Run the spreads dev scenario
        run: ./scripts/dev-spreads.sh
      - name: Run the daily snapshots dev scenario
        run: ./scripts/dev-daily-snapshots.sh
      - name: Run the member snapshot start dev scenario
        run: ./scripts/dev-member-snapshot-start.sh
      - name: Check the wait from a price entering the sequencer's channel to its stamp at 100k accounts
        run: cargo test -p engine-node --lib --locked sequencer::wait_bench::price_wait_budget -- --ignored --nocapture
      - name: Check the same wait over 100k accounts each holding a hedged pair under portfolio margin
        run: cargo test -p engine-node --lib --locked sequencer::wait_bench::portfolio -- --ignored --nocapture
      - name: Check sequencer command latency at 100k accounts
        run: cargo test -p engine-core --test hot_path_benchmark --locked -- --ignored --nocapture --test-threads=1
      - name: Check sequencer command latency on a launch-scale book at 100k accounts
        run: cargo test -p engine-core --test launch_book_benchmark --locked -- --ignored --nocapture --test-threads=1 launch_book_latency
      - name: Check the mass events on a launch-scale book at 100k accounts
        run: cargo test -p engine-core --test mass_events_benchmark --locked -- --ignored --nocapture --test-threads=1 mass_
      - name: Check what a price waits behind a mass close-out at 100k accounts
        run: cargo test -p engine-node --lib --locked sequencer::wait_bench::mass -- --ignored --nocapture --test-threads=1
      - name: Check a walk of BTC-USD on launch-scale books with accounts near their close-out level
        run: cargo test -p engine-core --test launch_book_benchmark --locked -- --ignored --nocapture --test-threads=1 launch_book_price_walk
      - name: Check the level path of a price at 100k take-profit and stop-loss levels
        run: cargo test -p engine-core --lib --locked levels::tests::the_level_path -- --ignored --nocapture --test-threads=1
      - name: Check what a price waits behind the daily rollover and the MONKEY period close at 100k accounts
        run: cargo test -p engine-node --lib --locked sequencer::wait_bench::rollover -- --ignored --nocapture --test-threads=1
      - name: Check the stats record's cost on a launch-scale book at 100k accounts
        run: cargo test -p engine-node --lib --locked stats::launch_bench -- --ignored --nocapture --test-threads=1

