name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Every job, nightly, on main.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A merge group's ref names its pull request and base commit, so a group shares it only with the
# stale run of a group the queue rebuilt on the same base, which the new run cancels. A push to main
# and the nightly run share main's group and cancel nothing that has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

jobs:
  # Sorts the changed files into areas; every other job runs only when its area is true. A pull
  # request's files are its diff against its base. A merge group's are its diff against `main`: the
  # queue merges every entry under a head group that passes, so the head's run covers each entry
  # ahead of it; a merge group also always runs the Rust and contracts checks. A push to `main`, the
  # nightly run, a manual run, a failed diff, a workflow change, and any path not listed set every
  # area true, so only the listed paths can skip a job. Each path lists the area of every job that
  # reads it. Each scenario job has its own area, named after it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      contracts: ${{ steps.classify.outputs.contracts }}
      image: ${{ steps.classify.outputs.image }}
      agent_scripts: ${{ steps.classify.outputs.agent_scripts }}
      merge_approval: ${{ steps.classify.outputs.merge_approval }}
      ci_changes: ${{ steps.classify.outputs.ci_changes }}
      snp_host: ${{ steps.classify.outputs.snp_host }}
      engine_build: ${{ steps.classify.outputs.engine_build }}
      vault_deposits: ${{ steps.classify.outputs.vault_deposits }}
      daily_rotation: ${{ steps.classify.outputs.daily_rotation }}
      short_turns: ${{ steps.classify.outputs.short_turns }}
      metrics_alerts: ${{ steps.classify.outputs.metrics_alerts }}
      alert_outbox: ${{ steps.classify.outputs.alert_outbox }}
      browser_origin: ${{ steps.classify.outputs.browser_origin }}
      dashboard_data: ${{ steps.classify.outputs.dashboard_data }}
      proxy_protocol: ${{ steps.classify.outputs.proxy_protocol }}
      batch_orders: ${{ steps.classify.outputs.batch_orders }}
      ct_watch: ${{ steps.classify.outputs.ct_watch }}
      snapshot_restart: ${{ steps.classify.outputs.snapshot_restart }}
      signed_api: ${{ steps.classify.outputs.signed_api }}
      production_secrets: ${{ steps.classify.outputs.production_secrets }}
      log_heads: ${{ steps.classify.outputs.log_heads }}
      scenario_tests: ${{ steps.classify.outputs.scenario_tests }}
      rwa_feeds: ${{ steps.classify.outputs.rwa_feeds }}
      toxicity: ${{ steps.classify.outputs.toxicity }}
      venue_load: ${{ steps.classify.outputs.venue_load }}
      node_load: ${{ steps.classify.outputs.node_load }}
      soak: ${{ steps.classify.outputs.soak }}
      recovery_scale: ${{ steps.classify.outputs.recovery_scale }}
      loss_trigger: ${{ steps.classify.outputs.loss_trigger }}
      cme_feeds: ${{ steps.classify.outputs.cme_feeds }}
      share_feeds: ${{ steps.classify.outputs.share_feeds }}
      attestation_verifier: ${{ steps.classify.outputs.attestation_verifier }}
      acme: ${{ steps.classify.outputs.acme }}
      wasm_verifier: ${{ steps.classify.outputs.wasm_verifier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          # The scenario jobs that run the node from `engine-build`'s artifact, those on Anvil that run
          # engine-node's lib tests, and those against loopback venues.
          prebuilt="metrics_alerts alert_outbox browser_origin dashboard_data proxy_protocol batch_orders ct_watch snapshot_restart signed_api production_secrets log_heads"
          anvil="vault_deposits daily_rotation short_turns"
          feeds="toxicity loss_trigger rwa_feeds cme_feeds share_feeds venue_load node_load soak"
          # Every scenario that runs engine-node's lib tests, every one that runs the node, and every one.
          lib_tests="$anvil $feeds scenario_tests attestation_verifier recovery_scale"
          # The scenarios that drive the API.
          api="signed_api browser_origin proxy_protocol batch_orders dashboard_data acme scenario_tests node_load soak"
          node="$prebuilt $lib_tests acme"
          scenarios="$node wasm_verifier"
          all="rust contracts image agent_scripts merge_approval ci_changes snp_host $scenarios"
          areas=$all
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            merge_group) range="origin/main...$SHA" ;;
            *) range= ;;
          esac
          # --no-renames lists both sides of a move.
          if [[ -n "$range" ]] && files=$(git diff --name-only --no-renames "$range"); then
            echo "$files"
            areas=
            if [[ "$EVENT" == merge_group ]]; then areas="rust contracts"; fi
            while IFS= read -r file; do
              case "$file" in
                # The review-delta helper and its test.
                agents/skills/agent-code-review/scripts/*) areas+=" agent_scripts" ;;
                # The merge queue's approval gate and its test.
                scripts/check-merge-approved.sh | scripts/check-merge-approved-test.sh) areas+=" merge_approval" ;;
                # This classifier's test; a change to the classifier itself runs every job.
                scripts/ci-changes-test.sh) areas+=" ci_changes" ;;
                # The SEV-SNP host's preflight and launch scripts and their fixture tests.
                scripts/snp-host-check.sh | scripts/snp-host-check-test.sh | scripts/snp-launch.sh \
                  | scripts/snp-launch-test.sh)
                  areas+=" snp_host" ;;
                # The SEV-SNP guest's config writer, which an engine-node test runs.
                scripts/snp-node-config.py) areas+=" rust" ;;
                # The engine-core agreement tests read the research studies' shared vectors.
                research/close-spread-calibration/fixtures/* | research/benchmark-cap/fixtures/* \
                  | research/benchmark-cap/results/refused.csv)
                  areas+=" rust" ;;
                # The cap study's market mix deals out the launch book's holdings.
                research/cap-calibration/data/derived/market_mix.csv)
                  areas+=" rust scenario_tests node_load soak recovery_scale" ;;
                # Read by no build, test, scenario, or image.
                agents/* | AGENTS.md | CLAUDE.md | README.md | SECURITY.md | docs/* | research/* | image/README.md \
                  | crates/core/README.md | crates/node/README.md | crates/verify/README.md \
                  | crates/verify-wasm/README.md | crates/wire/README.md | scripts/seed-relay-fixtures.sh \
                  | scripts/snp-local-chain.sh | scripts/snp-bench-guest.sh) ;;
                # The contracts' tests read the engine's proof vectors and the withdrawal vector, which
                # the node's tests also read.
                crates/core/tests/fixtures/emissions.json | crates/core/tests/fixtures/exit.json \
                  | contracts/test/fixtures/withdrawal.json)
                  areas+=" rust contracts" ;;
                # Test-only modules (`tests`, `*_tests`, `scenario`, `*_scenario`, `*bench`, `test_support`)
                # compile under `cfg(test)` alone, into no binary a scenario or the image runs. A scenario
                # that runs engine-node's lib tests takes each test module its tests reach.
                crates/node/src/test_support/* | crates/node/src/test_tracing.rs | crates/node/tests/common/* \
                  | crates/node/src/trusted_time/tests/*)
                  areas+=" rust $lib_tests" ;;
                crates/node/src/feeds/tests/*) areas+=" rust $feeds" ;;
                crates/node/src/verify/tests/* | crates/node/src/api/tests.rs | crates/node/src/api/tests/* \
                  | crates/node/src/log/authenticated_tests*)
                  areas+=" rust attestation_verifier" ;;
                crates/node/src/api/access_tests* | crates/node/src/api/benchmark_tests* \
                  | crates/node/src/sequencer/wait_bench.rs | crates/node/src/sequencer/wait_bench/* \
                  | crates/node/src/stats/bench.rs \
                  | crates/node/src/stats/launch_bench.rs)
                  areas+=" rust scenario_tests" ;;
                # The node load scenario drives the node it assembles from the sequencer, feeds and API;
                # it and the mass-event benchmarks seed a sequencer with the launch book.
                crates/node/src/load_scenario/*) areas+=" rust node_load soak recovery_scale" ;;
                crates/node/src/sequencer/seeded.rs) areas+=" rust scenario_tests node_load soak recovery_scale" ;;
                # The recovery scenario writes a long log on the launch book and recovers, replicates
                # and hands it over.
                crates/node/src/sequencer/recovery_scale/*) areas+=" rust recovery_scale soak" ;;
                crates/node/src/api/admin_tests* | crates/node/src/sequencer/fixture_tests.rs)
                  areas+=" rust scenario_tests vault_deposits attestation_verifier" ;;
                crates/node/src/checkpoints/scenario* | crates/node/src/checkpoints/tests*)
                  areas+=" rust scenario_tests $anvil" ;;
                crates/node/src/custody/tests/* | crates/node/src/seed_relay/tests/* | crates/node/src/node/tests* \
                  | crates/node/src/node/member/turn/tests/* | crates/node/src/secrets/tests* \
                  | crates/node/src/log_check/tests* | crates/node/src/sequencer/withdrawal_scenario/* \
                  | crates/node/src/checkpoints/*_scenario* | crates/node/src/checkpoints/accounting/tests* \
                  | crates/node/src/sequencer/checkpoints/accounting_tests* \
                  | crates/node/src/sequencer/replay/accounting_tests*)
                  areas+=" rust $anvil" ;;
                crates/*/src/tests.rs | crates/*/src/tests/* | crates/*/src/*/tests.rs | crates/*/src/*/tests/* \
                  | crates/*/src/*_tests.rs | crates/*/src/*_tests/* | crates/*/src/*/scenario.rs \
                  | crates/*/src/*/scenario/* | crates/*/src/*_scenario.rs | crates/*/src/*_scenario/* \
                  | crates/*/src/*bench.rs)
                  areas+=" rust" ;;
                # The node's module families, each starting the scenarios that drive it directly. A
                # scenario that only reaches a family through another is left to the full runs on
                # `main` and nightly.
                crates/node/src/ct_watch/*) areas+=" rust ct_watch" ;;
                # Feeds: the venue adapters and the mock feed. The sequencer's quote bound stamps every
                # command, so it stays with the sequencer.
                crates/node/src/feeds/* | crates/node/src/node/price_feeds.rs)
                  areas+=" rust $feeds scenario_tests metrics_alerts production_secrets" ;;
                # Rotation and liveness: handovers, members, standbys, log checks and heads, the seed
                # relay, turns and votes, and the custody mirrors of the registry, schedule and staking.
                crates/node/src/handover/* | crates/node/src/liveness/* | crates/node/src/standby/* \
                  | crates/node/src/standby_key/* | crates/node/src/log_check/* | crates/node/src/log_heads/* \
                  | crates/node/src/seed_relay/* | crates/node/src/node/member* | crates/node/src/node/handover.rs \
                  | crates/node/src/node/liveness* | crates/node/src/node/log_check.rs | crates/node/src/node/ready* \
                  | crates/node/src/node/turn_keys* | crates/node/src/node/keys* | crates/node/src/node/registration.rs \
                  | crates/node/src/sequencer/turns* | crates/node/src/sequencer/liveness* \
                  | crates/node/src/sequencer/log_check* | crates/node/src/sequencer/governance* \
                  | crates/node/src/sequencer/prefixes* | crates/node/src/sequencer/replay/live* \
                  | crates/node/src/sequencer/checkpoints/handover* \
                  | crates/node/src/custody/registry* | crates/node/src/custody/staking* \
                  | crates/node/src/custody/evm/staking* | crates/node/src/custody/standby_keys* \
                  | crates/node/src/custody/operators/* | crates/node/src/api/operator* | crates/node/src/api/standby* \
                  | crates/node/src/api/archive.rs)
                  areas+=" rust $anvil log_heads scenario_tests recovery_scale" ;;
                # Custody: the vault's deposits, checkpoints, withdrawals and payouts, the exit, and
                # screened access.
                crates/node/src/custody/* | crates/node/src/checkpoints/* | crates/node/src/withdrawals.rs \
                  | crates/node/src/sequencer/payout* | crates/node/src/exit.rs | crates/node/src/api/payouts.rs \
                  | crates/node/src/api/reissue.rs | crates/node/src/api/withdrawal_queue.rs | crates/node/src/api/exit.rs)
                  areas+=" rust vault_deposits scenario_tests production_secrets log_heads snapshot_restart recovery_scale" ;;
                crates/node/src/access* | crates/node/src/sequencer/access* | crates/node/src/api/access.rs \
                  | crates/node/src/api/state*)
                  areas+=" rust vault_deposits scenario_tests snapshot_restart $api" ;;
                # The API: its routes, stream, TLS and limits.
                crates/node/src/api/stream/quotes/* | crates/node/src/api/admin.rs \
                  | crates/node/src/api/distributions.rs | crates/node/src/limits/*)
                  areas+=" rust $api vault_deposits" ;;
                crates/node/src/api/attestation.rs) areas+=" rust $api attestation_verifier" ;;
                # The stream's feed, which the recovery scenario's history catch-up reads the log through.
                crates/node/src/api/stream/mod.rs) areas+=" rust $api recovery_scale" ;;
                crates/node/src/api/* | crates/node/src/tls/*) areas+=" rust $api" ;;
                # Checkpoint caches.
                crates/node/src/snapshot/* | crates/node/src/sequencer/snapshots* \
                  | crates/node/src/sequencer/replay/snapshot*)
                  areas+=" rust snapshot_restart recovery_scale soak" ;;
                # Delivered secrets.
                crates/node/src/secrets/* | crates/node/src/node/secrets*) areas+=" rust production_secrets" ;;
                # The verifier's CLI, the collateral it relays and the CT watcher's checks.
                crates/node/src/verify/*)
                  areas+=" rust attestation_verifier wasm_verifier signed_api dashboard_data ct_watch" ;;
                # Stats, history and metrics, and the node watching itself.
                crates/node/src/stats/* | crates/node/src/history/* | crates/node/src/metrics/* \
                  | crates/node/src/monitor/* | crates/node/src/node/marks.rs)
                  areas+=" rust scenario_tests dashboard_data metrics_alerts snapshot_restart node_load soak recovery_scale" ;;
                # Alert routing.
                crates/node/src/alerts/* | crates/node/src/throttle.rs | crates/node/src/episodes.rs)
                  areas+=" rust metrics_alerts alert_outbox ct_watch production_secrets" ;;
                # The operator's signing client and the benchmark publishers' worker and client.
                crates/node/src/admin/* | crates/node/src/benchmarks/*)
                  areas+=" rust scenario_tests dashboard_data production_secrets vault_deposits ct_watch signed_api" ;;
                # The browser verifier's package.
                crates/verify-wasm/*) areas+=" rust wasm_verifier" ;;
                # Attestation verification, which the node's CLI and the CT watcher run.
                crates/verify/*) areas+=" rust image attestation_verifier wasm_verifier ct_watch signed_api" ;;
                # The scenarios' signed access source and request signer.
                crates/node/examples/access_source.rs | crates/core/examples/sign_request.rs)
                  areas+=" rust vault_deposits dashboard_data proxy_protocol batch_orders production_secrets snapshot_restart" ;;
                # The latency budget's engine-core benchmarks, and the harness they share.
                crates/core/tests/hot_path_benchmark* | crates/core/tests/launch_book_benchmark* \
                  | crates/core/tests/mass_events_benchmark*)
                  areas+=" rust scenario_tests" ;;
                # The harness, whose launch book the node load scenario also runs on.
                crates/core/tests/common/*) areas+=" rust scenario_tests node_load soak recovery_scale" ;;
                crates/core/tests/short_turns.rs) areas+=" rust short_turns" ;;
                # The replay fixture the checkpoint scenario's accounting test reaches.
                crates/node/tests/fixtures/*) areas+=" rust vault_deposits" ;;
                # The other integration tests, examples and reference logs run in the Rust jobs alone.
                crates/core/tests/* | crates/node/tests/* | crates/core/examples/* | crates/node/examples/*)
                  areas+=" rust" ;;
                # The shared foundations: the engine, engine-wire, the rest of the node (the sequencer,
                # config, startup and recovery, the TEE, trusted time and the log) and the workspace's
                # build. Every scenario, the browser verifier's included, and the image.
                crates/* | Cargo.toml | Cargo.lock) areas+=" rust image $scenarios" ;;
                # The image embeds config/test-keys.toml and boots on config/dev.toml; the node compiles
                # the keys in, and the scenarios run on dev.toml and anvil.toml.
                config/dev.toml | config/test-keys.toml) areas+=" rust image $node" ;;
                config/anvil.toml) areas+=" rust $lib_tests acme production_secrets log_heads" ;;
                # Read by the node's tests; the launch book's benchmarks build on the production genesis.
                config/production-genesis.toml) areas+=" rust scenario_tests node_load soak recovery_scale" ;;
                config/benchmark-publishers.toml | config/ct-watch.toml) areas+=" rust" ;;
                # The launch values scenario deploys from it, and the launch book's emissions and staking
                # start from it; the node's tests read the rest of ops/.
                ops/runbooks/production-deployment.toml)
                  areas+=" rust vault_deposits scenario_tests node_load soak recovery_scale" ;;
                # The node load scenario's connections, limits and screening slots are the template's, and
                # the launch values scenario reads its ticker.
                ops/runbooks/production-node.toml) areas+=" rust node_load soak vault_deposits" ;;
                ops/*) areas+=" rust" ;;
                rustfmt.toml | deny.toml | scripts/check-file-loc.sh | scripts/check-reference-logs.sh) areas+=" rust" ;;
                # The scenarios on Anvil deploy the contracts and their mocks; the contracts' own tests
                # stay with the contracts job.
                contracts/test/mocks/*) areas+=" contracts $anvil production_secrets log_heads" ;;
                contracts/test/* | contracts/README.md) areas+=" contracts" ;;
                contracts/*) areas+=" contracts $anvil production_secrets log_heads" ;;
                # Each scenario's scripts, and the helpers they run.
                scripts/dev-vault-deposits.sh | scripts/dev-checkpoints.sh | scripts/dev-monkey-emissions.sh \
                  | scripts/dev-monkey-staking.sh | scripts/dev-launch-values.sh | scripts/dev-operator-election.sh \
                  | scripts/dev-staking-reads.sh | scripts/dev-seed-relay.sh | scripts/dev-operator-share.sh \
                  | scripts/dev-standby-operator.sh | scripts/dev-operator-handover.sh \
                  | scripts/dev-deposit-finality.sh | scripts/dev-withdrawals.sh | scripts/dev-key-lifecycle.sh \
                  | scripts/dev-exit.sh | scripts/dev-access-enforcement.sh | scripts/dev-access-cases.sh \
                  | scripts/dev-quotes.sh | scripts/dev-quotes-cases.sh | scripts/dev-quotes-client.py)
                  areas+=" vault_deposits" ;;
                scripts/dev-daily-rotation.sh | scripts/dev-parameter-votes.sh | scripts/dev-liveness.sh \
                  | scripts/dev-operator-faults.sh)
                  areas+=" daily_rotation" ;;
                scripts/dev-short-turns.sh) areas+=" short_turns" ;;
                scripts/dev-rpc-proxy.py) areas+=" $anvil production_secrets log_heads" ;;
                scripts/dev-alert-audit.py) areas+=" vault_deposits log_heads" ;;
                scripts/dev-access-fixture.sh)
                  areas+=" vault_deposits dashboard_data proxy_protocol batch_orders production_secrets snapshot_restart" ;;
                scripts/dev-metrics-alerts.sh) areas+=" metrics_alerts" ;;
                scripts/dev-alert-outbox.sh) areas+=" alert_outbox" ;;
                scripts/dev-browser-origin.sh) areas+=" browser_origin" ;;
                scripts/dev-dashboard-data.sh) areas+=" dashboard_data" ;;
                scripts/dev-proxy-protocol.sh) areas+=" proxy_protocol" ;;
                scripts/dev-batch-orders.sh) areas+=" batch_orders" ;;
                scripts/dev-ct-watch.sh | scripts/dev-ct-log.py) areas+=" ct_watch" ;;
                scripts/dev-snapshot-restart.sh) areas+=" snapshot_restart" ;;
                scripts/dev-signed-api.sh | scripts/dev-status-notice.sh) areas+=" signed_api" ;;
                scripts/dev-production-secrets.sh) areas+=" production_secrets" ;;
                scripts/dev-log-heads.sh) areas+=" log_heads" ;;
                scripts/dev-acme.sh) areas+=" acme" ;;
                scripts/dev-corporate-actions.sh | scripts/dev-operator-bounds.sh | scripts/dev-params-notice.sh \
                  | scripts/dev-holding-fee.sh | scripts/dev-volume-tiers.sh | scripts/dev-weekend-margin.sh \
                  | scripts/dev-earned-leverage.sh | scripts/dev-tier-limits.sh | scripts/dev-volume-benefits.sh \
                  | scripts/dev-spreads.sh | scripts/dev-portfolio-margin.sh | scripts/dev-position-levels.sh \
                  | scripts/dev-daily-snapshots.sh | scripts/dev-member-snapshot-start.sh)
                  areas+=" scenario_tests" ;;
                scripts/dev-toxicity.sh) areas+=" toxicity" ;;
                scripts/dev-venue-load.sh) areas+=" venue_load" ;;
                scripts/dev-load.sh) areas+=" node_load" ;;
                scripts/dev-soak.sh) areas+=" soak" ;;
                scripts/dev-recovery-scale.sh) areas+=" recovery_scale" ;;
                scripts/dev-loss-trigger.sh) areas+=" loss_trigger" ;;
                scripts/dev-rwa-feeds.sh) areas+=" rwa_feeds" ;;
                scripts/dev-cme-feeds.sh) areas+=" cme_feeds" ;;
                scripts/dev-share-feeds.sh) areas+=" share_feeds" ;;
                scripts/dev-attestation-verifier.sh) areas+=" attestation_verifier" ;;
                scripts/dev-wasm-verifier.sh | scripts/dev-wasm-verifier.mjs | scripts/build-wasm-verifier.sh)
                  areas+=" wasm_verifier" ;;
                # A scenario file not listed above.
                scripts/dev-*) areas+=" $scenarios" ;;
                # The ACME scenario downloads its test CA under image/retry.
                image/retry) areas+=" image acme" ;;
                image/* | scripts/build-image.sh | scripts/check-image.sh | scripts/check-image-retry.sh)
                  areas+=" image" ;;
                *) areas=$all ;;
              esac
            done <<< "$files"
          fi
          for area in $all; do
            [[ " $areas " == *" $area "* ]] && value=true || value=false
            echo "$area=$value" | tee -a "$GITHUB_OUTPUT"
          done
          # Builds the node once for the scenarios that only run it.
          engine_build=false
          for area in $prebuilt; do
            if [[ " $areas " == *" $area "* ]]; then engine_build=true; fi
          done
          echo "engine_build=$engine_build" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  file-loc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check max file length
        run: ./scripts/check-file-loc.sh

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A build of engine-core's tests turns its test-only `closeout-oracle` feature on across the
      # workspace, so the library is linted again as the node's release build compiles it, without.
      - name: Clippy engine-core without its test-only feature
        run: cargo clippy -p engine-core --lib --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test
        run: cargo test --workspace --locked

  # The production feature set compiles apart from `test`'s, so it has its own job and cache.
  test-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test the node's production build
        run: cargo test -p engine-node --features production --locked --lib production_build

  # The reference sessions' example tests assert each session's end state without writing a
  # fixture; `cargo test --workspace` builds the examples but never runs these, so they need
  # their own run.
  reference-examples:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test the reference-log examples
        run: cargo test -p engine-core --locked --example reference_log

  # Every committed reference log must replay to its roots, and the accounting invariants must hold,
  # on x86_64 and aarch64. The `test` job runs both suites on x86_64 Linux, and this job on aarch64
  # Linux. No job runs on macOS: engine-core uses only integer fixed-point maths, with no floats or
  # OS calls, and macOS runs on the same two architectures.
  reference-logs:
    name: reference-logs (ubuntu-24.04-arm)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Replay reference logs
        run: cargo test -p engine-core --locked --test reference_logs
      - name: Check accounting invariants
        if: ${{ !cancelled() }}
        run: cargo test -p engine-core --locked --test invariants

  reference-logs-frozen:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed reference logs are unchanged
        env:
          # A PR against its base, a push against the commit it replaced, a merge group or a manual
          # run against main.
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'push' && github.event.before
            || 'origin/main' }}
        run: ./scripts/check-reference-logs.sh "$BASE"

  cargo-deny:
