    if: failure() && needs.merge-approval.result == 'failure'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel ${{ github.run_id }} \
            || echo "::warning::Run not cancelled (read-only fork token, or an API error); other jobs continue."

  cancel-ci-changes:
    needs: ci-changes
    if: failure() && needs.ci-changes.result == 'failure'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel ${{ github.run_id }} \
            || echo "::warning::Run not cancelled (read-only fork token, or an API error); other jobs continue."

  cancel-snp-host:
    needs: snp-host
    if: failure() && needs.snp-host.result == 'failure'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel ${{ github.run_id }} \
            || echo "::warning::Run not cancelled (read-only fork token, or an API error); other jobs continue."

  # The single check to require in branch rules. It runs even when a job it needs fails, is
  # cancelled, or is skipped, and passes only if every one of them succeeded or was skipped while
  # `changes` set its area false. Add every new job to `needs`, and a gated one to `$area` below.
  ci-passed:
    if: always()
    needs: [changes, fmt, file-loc, clippy, test, test-production, reference-examples, reference-logs, reference-logs-frozen, cargo-deny, contracts, dev-vault-deposits, dev-daily-rotation, dev-short-turns, engine-build, dev-metrics-alerts, dev-alert-outbox, dev-ct-watch, dev-browser-origin, dev-dashboard-data, dev-proxy-protocol, dev-scenario-tests, dev-batch-orders, dev-snapshot-restart, dev-rwa-feeds, dev-cme-feeds, dev-share-feeds, dev-toxicity, dev-venue-load, dev-load, dev-soak, dev-recovery-scale, dev-loss-trigger, dev-attestation-verifier, dev-signed-api, dev-production-secrets, dev-log-heads, dev-acme, wasm-verifier, wasm-verifier-compare, image, image-compare, review-delta, merge-approval, ci-changes, snp-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed, or to skip because its area did not change
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '
            .changes.outputs as $run
            | {fmt: "rust", "file-loc": "rust", clippy: "rust", test: "rust", "test-production": "rust", "reference-examples": "rust",
               "reference-logs": "rust", "reference-logs-frozen": "rust", "cargo-deny": "rust", contracts: "contracts",
               "dev-vault-deposits": "vault_deposits", "dev-daily-rotation": "daily_rotation", "dev-short-turns": "short_turns",
               "engine-build": "engine_build", "dev-metrics-alerts": "metrics_alerts", "dev-alert-outbox": "alert_outbox",
               "dev-ct-watch": "ct_watch", "dev-browser-origin": "browser_origin", "dev-dashboard-data": "dashboard_data",
               "dev-proxy-protocol": "proxy_protocol", "dev-scenario-tests": "scenario_tests", "dev-batch-orders": "batch_orders",
               "dev-snapshot-restart": "snapshot_restart", "dev-rwa-feeds": "rwa_feeds", "dev-toxicity": "toxicity", "dev-venue-load": "venue_load", "dev-load": "node_load", "dev-soak": "soak",
               "dev-recovery-scale": "recovery_scale",
               "dev-loss-trigger": "loss_trigger", "dev-cme-feeds": "cme_feeds", "dev-share-feeds": "share_feeds",
               "dev-attestation-verifier": "attestation_verifier",
               "dev-signed-api": "signed_api", "dev-production-secrets": "production_secrets", "dev-log-heads": "log_heads",
               "dev-acme": "acme", "wasm-verifier": "wasm_verifier", "wasm-verifier-compare": "wasm_verifier", image: "image",
               "image-compare": "image", "review-delta": "agent_scripts", "merge-approval": "merge_approval",
               "ci-changes": "ci_changes", "snp-host": "snp_host"} as $area
            | ["wasm-verifier-compare", "image-compare"] as $compare
            | all(to_entries[]; .value.result == "success"
                or .value.result == "skipped" and $run[$area[.key] // ""] == "false"
                or .value.result == "skipped" and ($ENV.EVENT == "pull_request" or $ENV.EVENT == "merge_group")
                  and ([.key] | inside($compare)))'

  # A push to `main` or the nightly run that fails opens an issue labelled `bug`, or comments on the
  # open one, naming the failed jobs and linking the run. It runs no repository code, so it alone
  # holds `issues: write`; it runs on no pull request or merge group, so it has no companion.
  main-failure-issue:
    needs: ci-passed
    if: >-
      ${{ !cancelled() && needs.ci-passed.result == 'failure'
      && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the issue for main's failing CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          title="CI failing on main"
          # shellcheck disable=SC2016 # jq's string interpolation, not the shell's.
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "ci-passed" and (.conclusion == "failure" or .conclusion == "cancelled"
              or .conclusion == "timed_out")) | "- `\(.name)` (\(.conclusion))"')
          if [[ "$EVENT" == schedule ]]; then run="nightly run"; else run="push"; fi
          body="CI run [$RUN_ID, attempt $RUN_ATTEMPT]($RUN_URL), the $run of \`$SHA\` on main, failed.

          Failed jobs:
          ${failed:-none; ci-passed refused a job that was skipped.}

          Read each failed job's log first. The likely causes are:
          - a timing guard or a race that a loaded runner trips, which a rerun passes;
          - a job cancelled at its timeout, which keeps no log: the output it printed while it ran names the
            stage that hung;
          - a run cancelled by something else, such as a newer run of the same ref;
          - a job that fails here after its change's pull request and merge group skipped it, which reads a
            path its area in \`changes\` does not list."
          number=$(gh issue list --state open --label bug --limit 500 --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
