        run: ./scripts/dev-acme.sh

  # Builds the browser verifier's package twice on separate runners with no shared cache and the
  # pinned toolchain, the second from another checkout path, with a space in it, so the build's path
  # remapping is covered; the first run also checks that package against the CLI on every fixture and vector.
  # `wasm-verifier-compare` fails if the two builds differ by a single byte. A pull request and a merge
  # group build it once; the second build and the comparison run on a push to main, nightly, and on a
  # manual run.
  wasm-verifier:
    name: wasm-verifier (${{ matrix.run }})
    needs: changes
    if: needs.changes.outputs.wasm_verifier == 'true'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        run: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["first"]' || '["first","second"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ matrix.run == 'second' && 'elsewhere/engine copy' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.run == 'second' && 'elsewhere/engine copy' || '' }}
      # scripts/build-wasm-verifier.sh pins this toolchain and the wasm-bindgen CLI version.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the package
        run: ./scripts/build-wasm-verifier.sh out/wasm-verifier
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-verifier-${{ matrix.run }}
          path: ${{ matrix.run == 'second' && 'elsewhere/engine copy/' || '' }}out/wasm-verifier/
          retention-days: 14
          if-no-files-found: error
      - name: Run the browser verifier dev scenario on the package
        if: matrix.run == 'first'
        run: ./scripts/dev-wasm-verifier.sh out/wasm-verifier

  wasm-verifier-compare:
    needs: [changes, wasm-verifier]
    if: needs.changes.outputs.wasm_verifier == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-verifier-*
      - name: Compare the two builds
        run: |
          (cd wasm-verifier-first && sha256sum -c SHA256SUMS)
          (cd wasm-verifier-second && sha256sum -c SHA256SUMS)
          diff wasm-verifier-first/SHA256SUMS wasm-verifier-second/SHA256SUMS
          cat wasm-verifier-first/SHA256SUMS

  # Builds the enclave image twice on separate runners with no shared cache, then boots it under
  # QEMU: the production image must refuse mock providers, and the dev image must attest its config
  # hash. `image-compare` fails if the two builds differ by a single byte. The first run also checks
  # the build's download retries. A pull request and a merge group build it once, with the dev image;
  # the second build and the comparison run on a push to main, nightly, and on a manual run.
  image:
    name: image (${{ matrix.run }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        run: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["first"]' || '["first","second"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the build's download retries
        if: matrix.run == 'first'
        run: ./scripts/check-image-retry.sh
      - name: Build the image
        run: ./scripts/build-image.sh out/image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.run }}
          path: out/image/
          retention-days: 14
          if-no-files-found: error
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 xxd
      - name: Boot the image and check it refuses mock providers
        run: ./scripts/check-image.sh out/image
      - name: Build the dev image
        if: matrix.run == 'second' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: ./scripts/build-image.sh --variant dev out/image-dev
      - name: Boot the dev image and check its attestation
        if: matrix.run == 'second' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: ./scripts/check-image.sh out/image-dev

  image-compare:
    needs: [changes, image]
    if: needs.changes.outputs.image == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
      - name: Compare the two builds
        run: |
          (cd image-first && sha256sum -c SHA256SUMS)
          (cd image-second && sha256sum -c SHA256SUMS)
          diff image-first/SHA256SUMS image-second/SHA256SUMS
          cat image-first/SHA256SUMS image-first/measurement.json

  review-delta:
    needs: changes
    if: needs.changes.outputs.agent_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the review-delta helper
        run: ./agents/skills/agent-code-review/scripts/review-delta-test.sh

  merge-approval:
    needs: changes
    if: needs.changes.outputs.merge_approval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the merge queue's approval gate
        run: ./scripts/check-merge-approved-test.sh

  ci-changes:
    needs: changes
    if: needs.changes.outputs.ci_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the changes classifier
        run: ./scripts/ci-changes-test.sh

  snp-host:
    needs: changes
    if: needs.changes.outputs.snp_host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the SEV-SNP host check on fixture hosts
        run: ./scripts/snp-host-check-test.sh
      - name: Test the SEV-SNP launch command on a fixture image
        run: ./scripts/snp-launch-test.sh

  # Each job above but `changes` has a `cancel-` companion that runs only on a pull request or a
  # merge group, and only when that job itself fails (`failure()` alone is also true for a failed
  # ancestor such as `changes`). It cancels the run, so the first failed job stops the rest from
  # spending runner minutes; `ci-passed` still runs and fails on the cancelled jobs, so the merge
  # queue drops a failed group's pull request without waiting for the slowest job. A push to `main`,
  # the nightly run and a manual run skip the companions and the image matrix's `fail-fast`: every job
  # runs to the end, so caches are saved whole and every failure shows. The companions run no repository code,
  # so `actions: write` is held by them alone. They are not in `ci-passed`'s `needs`. `changes` has
  # none, so its failure leaves the other jobs to skip as before. A job that times out is
  # cancelled, not failed, so its companion skips and the run continues. A new job gets a
  # companion.
  cancel-fmt:
    needs: fmt
    if: failure() && needs.fmt.result == 'failure'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
