name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

jobs:
  # Sorts a PR's changed files into areas; every other job runs only when its area is true. A push,
  # a manual run, a failed diff, a workflow change, and any path not listed set every area true, so
  # only the listed paths can skip a job. Each path lists the area of every job that reads it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      contracts: ${{ steps.classify.outputs.contracts }}
      scenarios: ${{ steps.classify.outputs.scenarios }}
      image: ${{ steps.classify.outputs.image }}
      agent_scripts: ${{ steps.classify.outputs.agent_scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all="rust contracts scenarios image agent_scripts"
          areas=$all
          # --no-renames lists both sides of a move.
          if [[ "$EVENT" == pull_request ]] && files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            echo "$files"
            areas=
            while IFS= read -r file; do
              case "$file" in
                # The review-delta helper and its test.
                agents/skills/agent-code-review/scripts/*) areas+=" agent_scripts" ;;
                # Read by no build, test, scenario, or image.
                agents/* | AGENTS.md | CLAUDE.md | README.md | SECURITY.md | research/* | image/README.md \
                  | crates/core/README.md | crates/node/README.md) ;;
                # The contracts' emission tests read the engine's entitlement proof vectors.
                crates/core/tests/fixtures/emissions.json) areas+=" rust scenarios image contracts" ;;
                # The image embeds config/test-keys.toml and boots on config/dev.toml.
                crates/* | Cargo.toml | Cargo.lock | config/dev.toml | config/test-keys.toml)
                  areas+=" rust scenarios image" ;;
                # Read by the node's tests, which the checkpoint scenario also compiles.
                config/anvil.toml | config/benchmark-publishers.toml | config/production-genesis.toml | ops/*)
                  areas+=" rust scenarios" ;;
                rustfmt.toml | deny.toml | scripts/check-file-loc.sh | scripts/check-reference-logs.sh)
                  areas+=" rust" ;;
                # The deposit and checkpoint scenarios deploy the vault.
                contracts/*) areas+=" contracts scenarios" ;;
                # The test job runs the corporate-action scenario.
                scripts/dev-corporate-actions.sh) areas+=" rust" ;;
                scripts/dev-*) areas+=" scenarios" ;;
                image/* | scripts/build-image.sh | scripts/check-image.sh | scripts/check-image-retry.sh)
                  areas+=" image" ;;
                *) areas=$all ;;
              esac
            done <<< "$files"
          fi
          for area in $all; do
            [[ " $areas " == *" $area "* ]] && value=true || value=false
            echo "$area=$value" | tee -a "$GITHUB_OUTPUT"
          done

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  file-loc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check max file length
        run: ./scripts/check-file-loc.sh

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked
      - name: Run the signed corporate-action dev scenario
        run: ./scripts/dev-corporate-actions.sh
      - name: Check sequencer command latency at 100k accounts
        run: cargo test -p engine-core --test hot_path_benchmark --locked -- --ignored --nocapture
      - name: Test the node's production build
        run: cargo test -p engine-node --features production --locked --lib production_build

  # The reference sessions' example tests assert each session's end state without writing a
  # fixture; `cargo test --workspace` builds the examples but never runs these, so they need
  # their own run.
  reference-examples:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test the reference-log examples
        run: cargo test -p engine-core --locked --example reference_log

  # Every committed reference log must replay to its roots, and the accounting invariants must hold,
  # on x86_64 and aarch64. The `test` job runs both suites on x86_64 Linux, and this job on aarch64
  # Linux. No job runs on macOS: engine-core uses only integer fixed-point maths, with no floats or
  # OS calls, and macOS runs on the same two architectures.
  reference-logs:
    name: reference-logs (ubuntu-24.04-arm)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Replay reference logs
        run: cargo test -p engine-core --locked --test reference_logs
      - name: Check accounting invariants
        if: ${{ !cancelled() }}
        run: cargo test -p engine-core --locked --test invariants

  reference-logs-frozen:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed reference logs are unchanged
        env:
          # A PR against its base, a push against the commit it replaced, a manual run against main.
          BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'push' && github.event.before
            || 'origin/main' }}
        run: ./scripts/check-reference-logs.sh "$BASE"

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
          cache: false
      - name: Install dependencies
        run: forge soldeer install
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test

  dev-vault-deposits:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
          cache: false
      - name: Install contract dependencies
        working-directory: contracts
        run: forge soldeer install
      - name: Run the vault deposit and RPC quorum dev scenario
        env:
          RPC_QUORUM_SCENARIO: "1"
          RPC_A_PORT: "8546" # Exercise a destination matching provider B's original config port.
        run: ./scripts/dev-vault-deposits.sh
      - name: Run the checkpoint dev scenario
        run: ./scripts/dev-checkpoints.sh
      - name: Run the MONKEY emissions dev scenario
        run: ./scripts/dev-monkey-emissions.sh
      - name: Run sequencer confirmation and Ethereum finality dev scenario
        run: ./scripts/dev-deposit-finality.sh
      - name: Run signed withdrawals, crash recovery, and FIFO liquidity on Anvil
        run: ./scripts/dev-withdrawals.sh

  dev-metrics-alerts:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the metrics and alert routing dev scenario
        run: ./scripts/dev-metrics-alerts.sh

  dev-alert-outbox:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the durable alert outbox kill/restart dev scenario
        run: ./scripts/dev-alert-outbox.sh

  dev-snapshot-restart:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the snapshot restart dev scenario
        run: ./scripts/dev-snapshot-restart.sh

  dev-rwa-feeds:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the RWA price feeds dev scenario
        run: ./scripts/dev-rwa-feeds.sh

  dev-attestation-verifier:
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the attestation verifier dev scenario
        run: ./scripts/dev-attestation-verifier.sh

  # Builds the enclave image twice on separate runners with no shared cache, then boots it under
  # QEMU: the production image must refuse mock providers, and the dev image must attest its config
  # hash. `image-compare` fails if the two builds differ by a single byte. The first run also checks
  # the build's download retries.
  image:
    name: image (${{ matrix.run }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        run: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the build's download retries
        if: matrix.run == 'first'
        run: ./scripts/check-image-retry.sh
      - name: Build the image
        run: ./scripts/build-image.sh out/image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.run }}
          path: out/image/
          retention-days: 14
          if-no-files-found: error
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 xxd
      - name: Boot the image and check it refuses mock providers
        run: ./scripts/check-image.sh out/image
      - name: Build the dev image
        if: matrix.run == 'second'
        run: ./scripts/build-image.sh --variant dev out/image-dev
      - name: Boot the dev image and check its attestation
        if: matrix.run == 'second'
        run: ./scripts/check-image.sh out/image-dev

  image-compare:
    needs: [changes, image]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
      - name: Compare the two builds
        run: |
          (cd image-first && sha256sum -c SHA256SUMS)
          (cd image-second && sha256sum -c SHA256SUMS)
          diff image-first/SHA256SUMS image-second/SHA256SUMS
          cat image-first/SHA256SUMS image-first/measurement.json

  review-delta:
    needs: changes
    if: needs.changes.outputs.agent_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the review-delta helper
        run: ./agents/skills/agent-code-review/scripts/review-delta-test.sh

  # The single check to require in branch rules. It runs even when a job it needs fails or is
  # skipped, and passes only if every one of them succeeded or was skipped while `changes` set its
  # area false. Add every new job to `needs`, and a gated one to `$area` below.
  ci-passed:
    if: always()
    needs: [changes, fmt, file-loc, clippy, test, reference-examples, reference-logs, reference-logs-frozen, cargo-deny, contracts, dev-vault-deposits, dev-metrics-alerts, dev-alert-outbox, dev-snapshot-restart, dev-rwa-feeds, dev-attestation-verifier, image, image-compare, review-delta]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed, or to skip because its area did not change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '
            .changes.outputs as $run
            | {fmt: "rust", "file-loc": "rust", clippy: "rust", test: "rust", "reference-examples": "rust",
               "reference-logs": "rust", "reference-logs-frozen": "rust", "cargo-deny": "rust", contracts: "contracts",
               "dev-vault-deposits": "scenarios", "dev-metrics-alerts": "scenarios",
               "dev-alert-outbox": "scenarios", "dev-snapshot-restart": "scenarios",
               "dev-rwa-feeds": "scenarios", "dev-attestation-verifier": "scenarios", image: "image",
               "image-compare": "image", "review-delta": "agent_scripts"} as $area
            | all(to_entries[]; .value.result == "success"
                or .value.result == "skipped" and $run[$area[.key] // ""] == "false")'
