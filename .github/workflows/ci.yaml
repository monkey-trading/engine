      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: engine-lib
          save-if: false
          cache-on-failure: true
      - name: Run the recovery dev scenario at 10,000 accounts
        env:
          RECOVERY_ACCOUNTS: "10000"
          RECOVERY_TRADERS: "200"
          RECOVERY_START_SECS: "21420"
          RECOVERY_LAUNCH_SECS: "1200"
          RECOVERY_TEN_TIMES_SECS: "60"
          RECOVERY_SUFFIX_SECS: "300"
          RECOVERY_TAILS: "65536,1048576"
        run: ./scripts/dev-recovery-scale.sh

