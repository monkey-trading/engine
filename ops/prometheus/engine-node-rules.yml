# Alerting rules for the operator's Prometheus, which runs outside the enclave. They page on what
# the node cannot page itself: a node whose metrics stop answering, and alert pages that its
# webhook keeps failing or refuses, or that the node drops. They also escalate an API certificate
# that is missing or about to expire, past the node's own Warnings. Route them through Alertmanager
# to a receiver other than the node's own webhook. The rules assume the scrape job is named `engine`;
# scrape a Certificate Transparency watcher (`engine ct-watch`, which serves the same alert metrics)
# in that job too, as another instance, and they cover it.
groups:
  - name: engine-node
    rules:
      - alert: EngineNodeDown
        expr: up{job="engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} has not answered a metrics scrape for a minute"

      - alert: EngineAlertPagesFailing
        # The pages' severity moves to `route`, since this rule's own severity label replaces it.
        expr: >-
          label_replace(increase(engine_alert_deliveries_total{outcome=~"failed|dropped"}[15m]) > 0,
          "route", "$1", "severity", "(.*)")
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} could not deliver {{ $labels.route }} alert pages ({{ $labels.outcome }})"

      # Each failed post counts as it happens, so a webhook outage shows while its page is still
      # retrying; three failures in five minutes is past a single transient error.
      - alert: EngineAlertDeliveryFailing
        expr: >-
          label_replace(increase(engine_alert_attempts_failed_total[5m]) >= 3,
          "route", "$1", "severity", "(.*)")
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} keeps failing to post {{ $labels.route }} alert pages"

      - alert: EngineAlertLinesDropped
        expr: increase(engine_alerts_dropped_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} dropped alert lines before routing them"

      - alert: EngineAlertOutboxOverflow
        expr: increase(engine_alert_outbox_overflows_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} refused pages at its durable alert outbox size bound"

      # Escalates the node's Warnings certificate_pending and certificate_expiring. A node with
      # [api.tls.acme] has a CA certificate within a minute of boot, so half an hour pending is a
      # failed issuance; a node without the section, and a Certificate Transparency watcher, export
      # 0 for pending and never fire.
      - alert: EngineTlsCertificateMissing
        expr: engine_tls_certificate_pending == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }} has served only its self-signed TLS certificate for 30 minutes"

      - alert: EngineTlsCertificateExpiring
        expr: >-
          engine_tls_certificate_not_after_seconds > 0
          and engine_tls_certificate_not_after_seconds - time() < 7 * 86400
        labels:
          severity: critical
        annotations:
          summary: "Engine node {{ $labels.instance }}'s TLS certificate expires within 7 days and has not been renewed"
