# Production node config, without [genesis].
#
# Assemble the config a production node runs with, then hash it (sha256sum): the hash is part of the
# release the vault's timelock names, so one changed byte, a comment included, is another release.
#
#   cat ops/runbooks/production-node.toml config/benchmark-publishers.toml \
#       config/production-genesis.toml > node.toml
#
# Every value that is a placeholder or a decision still open carries a trailing marker comment. Set
# the value and delete the comment; the assembled file must contain no marker.
# ops/runbooks/deploy-and-rollback.md has the procedure.
#
# Secrets never appear in this file, so it can be published whole. It names them: `{name}` in an RPC
# provider's or the screening source's URL, `api_key_secret`, and `url_secret`. The operator delivers
# their values into the attested enclave (key-recovery.md, "Secrets"); a production build refuses
# `api_key_env` and `url_env`. A URL's origin stays here, so a delivered value never changes who answers.
#
# Paths are under /data, the image's one writable disk. The alert outbox must be a sibling of the
# log directory. A production build refuses mock providers, an unsigned API, plain-http origins and
# a config without [api.tls.acme].

[node]
# The guest address the host forwards port 443 to. The CA validates on it too.
listen = "0.0.0.0:8080"
log_dir = "/data/log"
segment_commands = 1000
# A ceiling: at most one checkpoint is in flight, so the cadence follows the chain's finality.
checkpoint_every = 1000
tick = "250ms"
# Recorded in the log on first start, with the custody chain id and vault.
auth = "eip712"

[logging]
level = "info"

[api]
# Keep max_connections below the process's open-file limit.
max_connections = 512
max_connections_per_ip = 32
handshake_timeout = "10s"
read_timeout = "30s"
max_body_bytes = 65536
per_ip = { per_second = 50, burst = 100 }
per_account = { per_second = 10, burst = 20 }
per_ip_connections = { per_second = 100, burst = 200 } # OWNER: keep it above per_ip
max_subscribers = 256
send_timeout = "30s"
# The console's https origin; any other browser origin is refused. A production build takes only https.
allowed_origins = ["https://console.example.com"] # REPLACE

# What wallets that have paid nothing may add to the public log: a token bucket, `burst` requests at
# once, refilled at `per_minute`, shared by all clients and one client's share of it. A production
# build refuses anything above these values.
[api.fresh_accounts]
shared = { per_minute = 60, burst = 120 }
per_client = { per_minute = 12, burst = 6 }

[api.tls.acme]
# The API's DNS name, lowercase. The CA connects to it on port 443.
domain = "api.example.com" # REPLACE
# Rehearse on the CA's staging directory first (a separate release).
directory_url = "https://acme-v02.api.letsencrypt.org/directory" # OWNER: the CA
contact = "mailto:ops@example.com" # REPLACE

# Behind a pass-through proxy that sends PROXY protocol v2, list its address ranges here. The header
# is unauthenticated: list only addresses that reach the node solely through your own proxy.
# [api.proxy_protocol]
# trusted = []

[tee]
provider = "configfs_tsm"
# The codename of the host's CPU generation; the node relays that generation's vendor collateral.
processor = "Genoa" # OWNER: the host's CPU generation

[tee.sealing]
dir = "/data/keys"

[tee.sealing.secrets]
# Where the operator delivers secrets. Forward it from the operator's addresses, not the public.
listen = "0.0.0.0:9472"

[tee.sealing.handover]
# Where a successor release asks this one for the keys. Reachable by the successor, not the public.
listen = "0.0.0.0:9471"
# Archive mirrors of the incumbent's log, for when this node takes the keys over an election.
mirrors = ["https://mirror-a.example.com", "https://mirror-b.example.com"] # REPLACE

[operator]
# Off at launch. The deployer is the only operator until the timelock turns the registry's rotation on.
rotation_enabled = false
# SEC1 public key of the operator's admin key (hex, 0x04 then 64 bytes). A placeholder: its private
# key was discarded.
public_key = "0x045a1ac079d8e8d39ae3b157534b725ac6249271c637e4990e757031332c9f5a3a94358448d7b698b31a8b99cd137c950532ad908acda681abdc19489fccb87a14" # REPLACE

[custody]
provider = "evm"
chain_id = 42161 # Arbitrum One
vault = "0x1111111111111111111111111111111111111111" # REPLACE

[custody.evm]
# At least three providers run by different operators, each serving state back to start_block.
# Each `{name}` is a key the operator delivers, in the URL's path or query.
providers = [
  { name = "provider-a", rpc_url = "https://rpc-a.example.com/v2/{provider_a_key}" }, # REPLACE
  { name = "provider-b", rpc_url = "https://rpc-b.example.com/v2/{provider_b_key}" }, # REPLACE
  { name = "provider-c", rpc_url = "https://rpc-c.example.com/v2/{provider_c_key}" }, # REPLACE
]
usdc = "0x2222222222222222222222222222222222222222" # REPLACE: the vault's usdc()
# Production credits at latest, less confirmations, and releases principal at finalized.
finality_tag = "latest"
withdrawal_finality_tag = "finalized"
confirmations = 2 # OWNER: blocks of the credit tag to wait
start_block = 1 # REPLACE: the vault's deployment block
max_block_range = 1000 # OWNER: within every provider's limits
poll_interval = "1s" # OWNER: within every provider's rate limits
rpc_timeout = "5s"
# Must exceed the credit tag's lag, one finalized-tag delay, and the wait for the next checkpoint, or
# a deposit pauses withdrawals; and the longest gap between batch posts. Not measured on Arbitrum
# One. The config hash is part of the release, so set it before the release is named.
stall_critical_after = "1h" # OWNER: measure on Arbitrum One first
# On Arbitrum One the finalized tag follows batch posting by about one Ethereum finality period.
finality_stalled_after = "30m"
cursor_path = "/data/custody-cursor.json"

[custody.evm.staking]
contract = "0x3333333333333333333333333333333333333333" # REPLACE
cursor_path = "/data/staking-cursor.json"

[custody.evm.staking.registry]
contract = "0x4444444444444444444444444444444444444444" # REPLACE
# The RegistryLens beside the registry, which GET /v1/operators reads through the custody quorum.
# Absent, that route answers 404; a node's config is part of its release, so a lens added later
# needs a new release.
# lens = "0x5555555555555555555555555555555555555555" # REPLACE
# The OperatorSchedule the registry names, whose rotation sets and daily turns the watcher mirrors
# from protocol V51. Absent, no turn is mirrored. Like the lens, it is part of the release.
# schedule = "0x6666666666666666666666666666666666666666" # REPLACE

# The ParameterVote over the schedule, whose passed proposals the watcher mirrors from protocol V56,
# and how long a fast-path restriction lasts (at most 7d). The node records both in the log once, so
# every member's release names the same. Without it, while rotation is on nothing changes the governed
# parameters. It needs the schedule above.
# [custody.evm.staking.registry.vote]
# contract = "0x7777777777777777777777777777777777777777" # REPLACE
# restriction_ttl = "24h" # OWNER: the restriction lifetime

[checkpoints]
# A separate endpoint from the custody providers. It signs and funds the relayer's transactions,
# so it must support eth_sendTransaction and hold a funded relayer dedicated to this log.
rpc_url = "https://checkpoint-rpc.example.com/v2/{checkpoint_rpc_key}" # REPLACE
relayer = "0x5555555555555555555555555555555555555555" # REPLACE
retry_interval = "2s"
rpc_timeout = "10s"

# Warns (`checkpoint_relayer_low`) when the relayer holds less than this many ether, read through
# the custody providers. Set it to several days of posting at the current gas price.
[checkpoints.relayer_gas]
min_balance = "0.01" # REPLACE

[log_heads]
# The LogHeads companion contract the enclave posts its newest released (seq, link) to. The
# checkpoint endpoint funds a second relayer dedicated to these posts; it must differ from the
# checkpoint relayer, whose nonce tracking assumes it alone uses its account.
contract = "0x7777777777777777777777777777777777777777" # REPLACE: the LogHeads deployment for this vault
relayer = "0x8888888888888888888888888888888888888888" # REPLACE: funded by the checkpoint endpoint
interval = "1h" # OWNER: the truncation window is the interval plus chain inclusion

[seed_relay]
# Proves each daily operator turn's RANDAO seed on Ethereum and relays it to the receiver on
# Arbitrum, which it reads through the custody providers (ops/runbooks/seed-relay.md). Every
# rotation-set member runs one, from launch, so seeds are on chain before rotation turns on.
providers = [
  { name = "ethereum-a", rpc_url = "https://eth-a.example.com/v2/{ethereum_a_key}" }, # REPLACE
  { name = "ethereum-b", rpc_url = "https://eth-b.example.com/v2/{ethereum_b_key}" }, # REPLACE
  { name = "ethereum-c", rpc_url = "https://eth-c.example.com/v2/{ethereum_c_key}" }, # REPLACE
]
chain_id = 1
# Signs and funds the relays as relayer, a key apart from the checkpoint relayer's.
rpc_url = "https://seed-relay-rpc.example.com/v2/{seed_relay_rpc_key}" # REPLACE
relayer = "0x9999999999999999999999999999999999999999" # REPLACE
# A beacon node that serves /eth/v2/debug/beacon/states, run by the operator.
beacon_api = "https://beacon.example.com" # REPLACE
relay = "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" # REPLACE: SeedRelay on Ethereum
receiver = "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" # REPLACE: SeedReceiver on Arbitrum
poll_interval = "60s"
rpc_timeout = "10s"
state_timeout = "300s" # OWNER: measure a state download from the beacon node
resend_after = "1h" # OWNER: above Arbitrum's usual delay for an Ethereum message
l2_max_fee_per_gas = "0.1" # OWNER: gwei; the unspent part is refunded on Arbitrum
min_balance = "0.05" # REPLACE: a week of relays at the current gas price

[feeds]
provider = "venues"
interval = "200ms"

[feeds.venues]
timeout = "10s"
reconnect_min = "500ms"
reconnect_max = "30s"
stale_after = "1s"
min_quote_spacing = "10ms"
# A stream further behind than max_delay, by its pings on the monotonic clock, counts as no quote.
# max_delay less ping_interval is the round trip tolerated. SECURITY.md states the bound this gives.
ping_interval = "500ms"
max_delay = "2s"

# Crypto: Coinbase and Kraken, public feeds with no key. Each market needs both (min_sources = 2).
[[feeds.venues.connections]]
venue = "coinbase"
url = "wss://advanced-trade-ws.coinbase.com"
symbols = [{ market = 1, symbol = "BTC-USD" }, { market = 2, symbol = "ETH-USD" }, { market = 3, symbol = "SOL-USD" }]

[[feeds.venues.connections]]
