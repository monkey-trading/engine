# The launch deployment's one-time inputs: the constructor values of the contracts and the values of
# the operator's two initialisations. The vault's and staking contract's values cannot change once
# deployed, nor the initialisations once recorded (the timelock's delay can move through the timelock),
# and the node refuses a different budget, epoch or cooldown than the contracts hold. Decided by the owner on
# 2026-11-14 (#436), and the operator schedule's heartbeat rule on 2026-11-21 (#1175). deploy-and-rollback.md
# uses them: "Deploy the contracts" and "Deploy the rotation contracts" for the contracts' constructors, and
# steps 9 and 10 of "First deployment" for `init-emissions` and `init-staking`.
# A test (`tests/production_deployment.rs`) holds each value to the decision and the runbook's
# commands to this file.
#
# A value that waits on a decision carries a trailing `OWNER` marker. Set it and delete the marker; for
# `start`, also drop the marker check in `tests/production_deployment.rs` in the same change.

# The deployment's single time origin: emissions' period 0 and staking's epoch 0 both start here, at
# 00:00:00 UTC on the day restricted mainnet trading opens. Sign both initialisations before it, and
# never reset it (#36): a start before trading opens cancels each idle period's budget for good.
start = "2027-01-01T00:00:00Z" # OWNER: 00:00:00 UTC on the day restricted mainnet trading opens

# `TimelockController` and the `Vault` constructor, in seconds (ops/runbooks/deploy-and-rollback.md,
# "Deploy the contracts"). The delay and the exit period stand as #360 set them.
[timelock]
min_delay = 259200 # 3 days

[vault]
# The initial emission period budget in MONKEY base units (18 decimals), a ten-minute period: 100,000
# MONKEY. It caps the token at 2 x 26,280 x budget, 5,256,000,000 MONKEY, and `init-emissions` must
# carry the same value.
period_budget = "100000000000000000000000"
exit_period = 1209600 # 14 days without a checkpoint before anyone may start the exit
claim_window = 2592000 # 30 days for exit claims to register
stale_after = 86400 # 1 day without a checkpoint before deposits are refused

# The `OperatorRegistry` constructor's `cooldownSeconds_` and `epochSeconds_`, which deploy `Staking`,
# in seconds. `init-staking` carries the same two values in milliseconds.
[staking]
epoch = 86400 # 1 day
cooldown = 2419200 # 28 days

# `init-staking`'s house NAV floor, in whole USD: NAV at or below it distributes nothing.
[init_staking]
liquidity_floor = "30500000"

# `OperatorSchedule`'s constructor (deploy-and-rollback.md, "Deploy the rotation contracts"), in seconds
# but for `block_millis` and `head_blocks`. The schedule takes the beacon genesis time and the turn length
# from the seed receiver. Its heartbeat rule is the owner's: a failed operator is replaced once three
# witnessed slots of 140 s pass with no head, 7 to 9.5 minutes after its last head landed. The bounds, the
# take window's bounds, the switch budget and the block time are fixed at deployment, and the timelock
# moves the rule and the window within them only while no turn names the operator.
[schedule]
# The handover's switch budget, which the take window and the rule must leave a skip's member: about six
# times the measured switch, 1 s in the daily rotation scenario plus the holder's and the successor's
# reads of the turn's latest assignment, about 2.2 s at 100 ms a round trip.
switch_budget = 20 # OWNER: proposed
# Arbitrum One's block time, under which `head_blocks` must span less than one interval.
block_millis = 250

[schedule.liveness]
heartbeat_interval = 140
head_tolerance = 40
heartbeat_misses = 3
head_blocks = 200 # OWNER: proposed; 50 s of blocks for a held head

# The least the timelock may set: no tolerance or held-head window under a head's 30 s round trip, and the
# fewest misses a two-slot take window allows. The shortest interval still exceeds the switch budget plus
# the longest tolerance, as a two-slot take window needs.
[schedule.liveness_minimums] # OWNER: proposed
heartbeat_interval = 90
head_tolerance = 30
heartbeat_misses = 3
head_blocks = 120

# The most: the launch interval, the longest that three misses allow at the launch tolerance; the most
# misses that ten minutes of detection allow at the shortest interval; and `arbBlockHash`'s reach.
[schedule.liveness_maximums] # OWNER: proposed
heartbeat_interval = 140
head_tolerance = 60
heartbeat_misses = 5
head_blocks = 256

# Witnessed slots a turn's member has to take it before anyone may skip it, and the bounds the timelock
# moves it within. It must stay below `heartbeat_misses`.
[schedule.take_window]
slots = 2
minimum = 2 # OWNER: proposed
maximum = 4 # OWNER: proposed

# `ParameterVote`'s constructor: how long a proposal takes votes on the normal path, whose change applies
# seven days after the log records it, and on the fast path, whose restriction applies at once, in seconds.
[parameter_vote]
normal_window = 259200 # OWNER: proposed, 3 days
fast_window = 3600 # OWNER: proposed, 1 hour
