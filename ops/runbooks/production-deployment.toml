# The launch deployment's one-time inputs: the constructor values of the contracts and the values of
# the operator's two initialisations. The vault's and staking contract's values cannot change once
# deployed, nor the initialisations once recorded (the timelock's delay can move through the timelock),
# and the node refuses a different budget, epoch or cooldown than the contracts hold. Decided by the owner on
# 2026-11-14 (#436). deploy-and-rollback.md uses them: section 2 for the contracts' constructors and
# step 8 for `init-emissions` and `init-staking`. A test (`tests/production_deployment.rs`) holds each
# value to the decision and the runbook's commands to this file.
#
# A value that waits on a decision carries a trailing `OWNER` marker. Set it and delete the marker; for
# `start`, also drop the marker check in `tests/production_deployment.rs` in the same change.

# The deployment's single time origin: emissions' period 0 and staking's epoch 0 both start here, at
# 00:00:00 UTC on the day restricted mainnet trading opens. Sign both initialisations before it, and
# never reset it (#36): a start before trading opens cancels each idle period's budget for good.
start = "2027-01-01T00:00:00Z" # OWNER: 00:00:00 UTC on the day restricted mainnet trading opens

# `TimelockController` and the `Vault` constructor, in seconds (ops/runbooks/deploy-and-rollback.md,
# "Deploy the contracts"). The delay and the exit period stand as #360 set them.
[timelock]
min_delay = 259200 # 3 days

[vault]
# The initial emission period budget in MONKEY base units (18 decimals), a ten-minute period: 100,000
# MONKEY. It caps the token at 2 x 26,280 x budget, 5,256,000,000 MONKEY, and `init-emissions` must
# carry the same value.
period_budget = "100000000000000000000000"
exit_period = 1209600 # 14 days without a checkpoint before anyone may start the exit
claim_window = 2592000 # 30 days for exit claims to register
stale_after = 86400 # 1 day without a checkpoint before deposits are refused

# The `OperatorRegistry` constructor's `cooldownSeconds_` and `epochSeconds_`, which deploy `Staking`,
# in seconds. `init-staking` carries the same two values in milliseconds.
[staking]
epoch = 86400 # 1 day
cooldown = 2419200 # 28 days

# `init-staking`'s house NAV floor, in whole USD: NAV at or below it distributes nothing.
[init_staking]
liquidity_floor = "30500000"
